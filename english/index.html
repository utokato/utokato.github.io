<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 个最常用英语单词 · 学习手册</title>
<meta name="description" content="按词频排序的 1000 个最常用英语单词，含中英释义、例句、惯用语、小片段和自测，按 5 天速通计划分日。">
<style>
/* ---------------------------------------------------------------
   Design tokens: warm paper, iron ink, seal vermilion, moss teal
   --------------------------------------------------------------- */
:root{
  --paper:#f4ede0;
  --paper-2:#fbf7ee;
  --paper-3:#ece2d0;
  --ink:#1c2430;
  --ink-2:#3d4a5c;
  --ink-3:#6b7686;
  --rule:#d8cbb4;
  --rule-2:#c8b795;
  --seal:#b23a2c;
  --seal-soft:#f0d9d3;
  --teal:#2f6f68;
  --teal-soft:#d6e6e2;
  --gold:#b98a2f;
  --shadow:0 1px 0 rgba(28,36,48,.05), 0 12px 28px -18px rgba(28,36,48,.45);
  /* Local fonts only; the switcher injected by scripts/font-switcher.html can override these. */
  --serif:Cambria,Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --body:"Noto Sans SC","Source Han Sans SC","思源黑体","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,"Noto Sans SC","Microsoft YaHei","PingFang SC",monospace;
  --radius:14px;
  --sidebar:284px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(255,255,255,.85), transparent 62%),
    radial-gradient(760px 520px at 108% 4%, rgba(47,111,104,.09), transparent 60%),
    radial-gradient(640px 420px at 88% 96%, rgba(178,58,44,.07), transparent 62%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(28,36,48,.045) 1px,transparent 1px);
  background-size:100% 30px;opacity:.5;
}
h1,h2,h3,h4,.display{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:6px}

/* Layout ------------------------------------------------------- */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  border-right:1px solid var(--rule);
  background:linear-gradient(180deg,rgba(251,247,238,.92),rgba(236,226,208,.7));
  padding:18px 14px 40px;
  position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  scrollbar-width:thin;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:6px}
.brand .mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--ink);color:var(--paper-2);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em;
  box-shadow:var(--shadow);
}
.brand b{font-family:var(--serif);font-size:18px;display:block;line-height:1.15}
.brand small{color:var(--ink-3);font-size:11.5px;font-family:var(--mono)}
.progress-ring{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:12px 0 14px;
  border:1px dashed var(--rule-2);border-radius:12px;background:rgba(255,255,255,.5)}
.ring{width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:grid;place-items:center;
  background:conic-gradient(var(--teal) calc(var(--p,0)*1%), rgba(28,36,48,.1) 0);}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;
  font-family:var(--mono);font-size:11px}
.progress-ring div small{color:var(--ink-3);font-family:var(--mono);font-size:11px;display:block}
.progress-ring div b{font-size:14px}
.nav-search{position:relative;margin-bottom:12px}
.nav-search input{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--rule-2);
  background:var(--paper-2);font-family:var(--body);font-size:14px;color:var(--ink);
}
.search-results{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--paper-2);
  border:1px solid var(--rule-2);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow-y:auto}
.search-results:empty{display:none}
.search-results a{display:flex;gap:8px;align-items:baseline;padding:8px 11px;text-decoration:none;font-size:14px;
  border-bottom:1px solid rgba(216,203,180,.6)}
.search-results a:last-child{border-bottom:0}
.search-results a:hover{background:var(--teal-soft)}
.search-results .en{font-family:var(--serif);font-weight:600}
.search-results .zh{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right}
.nav-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 6px 6px}
.nav-lesson{
  display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:9px;text-decoration:none;
  font-size:13.5px;color:var(--ink-2);border:1px solid transparent;
}
.nav-lesson:hover{background:rgba(255,255,255,.72);border-color:var(--rule)}
.nav-lesson.active{background:var(--paper-2);border-color:var(--rule-2);box-shadow:inset 3px 0 0 var(--seal)}
.nav-lesson .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:26px;padding-top:3px}
.nav-lesson .t{line-height:1.3}
.nav-lesson .t i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav-lesson.done .no::after{content:"✓";color:var(--teal);margin-left:2px}
.ch-group{margin-bottom:4px}
.ch-group>summary{cursor:pointer;padding:7px 8px;border-radius:9px;font-size:13.5px;font-weight:600;
  display:flex;gap:8px;align-items:center;list-style:none}
.ch-group>summary::-webkit-details-marker{display:none}
.ch-group>summary:hover{background:rgba(255,255,255,.7)}
.ch-badge{font-family:var(--mono);font-size:10.5px;background:var(--ink);color:var(--paper-2);
  border-radius:6px;padding:1px 6px}
.ch-prog{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.main{flex:1 1 auto;min-width:0;padding:26px 34px 90px;max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.topbar .spacer{flex:1 1 auto}
.chip-btn{
  border:1px solid var(--rule-2);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;
  font-size:12.5px;font-family:var(--mono);
}
.chip-btn:hover{background:var(--paper-2);border-color:var(--ink-3)}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}

/* Typography blocks ------------------------------------------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--seal);
  display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";height:1px;flex:1 1 auto;background:linear-gradient(90deg,var(--rule-2),transparent)}
h1{font-size:clamp(30px,4.6vw,46px);margin:14px 0 6px}
h2{font-size:clamp(22px,2.5vw,29px);margin:40px 0 12px}
h3{font-size:19px;margin:26px 0 10px}
.lede{font-size:18.5px;color:var(--ink-2);max-width:70ch}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.rule{border:0;border-top:1px solid var(--rule);margin:26px 0}
a.link{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(47,111,104,.35)}
a.link:hover{border-bottom-color:var(--teal)}

/* Hero --------------------------------------------------------- */
.hero{position:relative;border:1px solid var(--rule);border-radius:calc(var(--radius) + 6px);
  background:linear-gradient(155deg,rgba(255,255,255,.86),rgba(251,247,238,.6) 55%,rgba(214,230,226,.5));
  padding:34px 34px 30px;box-shadow:var(--shadow);overflow:hidden}
.hero::after{
  content:"1000";position:absolute;right:-8px;bottom:-58px;font-family:var(--serif);font-weight:700;
  font-size:190px;line-height:1;color:rgba(28,36,48,.05);pointer-events:none;
}
.hero .display{font-size:clamp(34px,6vw,62px);margin:16px 0 10px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:10px 17px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper-2);text-decoration:none;font-size:15px;
}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.seal{background:var(--seal);border-color:var(--seal)}
.btn:disabled{opacity:.5;cursor:progress;transform:none}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:26px}
.stat{border-top:1px solid var(--rule-2);padding-top:10px}
.stat b{font-family:var(--serif);font-size:26px;display:block}
.stat span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* Cards & grids ------------------------------------------------ */
.grid{display:grid;gap:16px}
.grid.cols-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{border:1px solid var(--rule);border-radius:var(--radius);background:rgba(255,255,255,.68);
  padding:18px;box-shadow:0 1px 0 rgba(28,36,48,.04)}
.card h3{margin:0 0 6px;font-size:18.5px}
.card p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.num{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.bar{height:6px;border-radius:999px;background:rgba(28,36,48,.1);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.day-card{border:1px solid var(--rule);border-radius:12px;padding:15px 16px;text-decoration:none;display:block;
  background:linear-gradient(135deg,var(--tint,rgba(47,111,104,.1)),rgba(255,255,255,.66) 62%)}
.day-card:hover{border-color:var(--ink-3);background:var(--paper-2)}
.day-card b{font-family:var(--serif);font-size:17px;display:block;margin:7px 0 3px}
.day-card small{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block}
.day-card .meta{display:block;margin-top:7px}
.day-badge{font-family:var(--mono);font-size:10.5px;background:var(--seal);color:#fff;
  padding:2px 9px;border-radius:999px;display:inline-block}
.rhythm{margin-top:16px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.58)}
.rhythm-row{display:grid;grid-template-columns:150px 200px 1fr;gap:16px;align-items:baseline;
  padding:12px 16px;border-top:1px solid var(--rule)}
.rhythm-row:first-child{border-top:0}
.rhythm-row:nth-child(even){background:rgba(255,255,255,.5)}
.rhythm-time{font-family:var(--mono);font-size:11.5px;color:var(--seal)}
.rhythm-row b{font-family:var(--serif);font-size:15.5px;font-weight:600}
.rhythm-row p{margin:0;font-size:14.5px;color:var(--ink-2)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--rule-2);color:var(--ink-3);background:rgba(255,255,255,.6)}
.pill.teal{background:var(--teal-soft);border-color:rgba(47,111,104,.35);color:#20504b}
.pill.seal{background:var(--seal-soft);border-color:rgba(178,58,44,.32);color:#8c2c21}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px;counter-reset:step}
.flow div{border:1px dashed var(--rule-2);border-radius:12px;padding:14px 16px;background:rgba(255,255,255,.55);
  position:relative}
.flow div::before{counter-increment:step;content:counter(step,decimal-leading-zero);position:absolute;
  top:-11px;left:14px;background:var(--seal);color:#fff;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:999px}
.flow b{display:block;margin:6px 0 4px;font-family:var(--serif);font-size:16px}
.flow p{margin:0;font-size:14.5px;color:var(--ink-2)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.step-dot{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule-2);border-radius:999px;padding:4px 11px;
  background:rgba(255,255,255,.6)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(216,203,180,.75);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  border-bottom-color:var(--rule-2)}
tbody tr:hover{background:rgba(255,255,255,.55)}
.table-wrap{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,.6)}

/* Word cards --------------------------------------------------- */
.word{border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-2);
  padding:16px 18px 14px;box-shadow:0 1px 0 rgba(28,36,48,.04);position:relative;scroll-margin-top:90px}
.word.flash{animation:flash 1.5s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(178,58,44,.55)}100%{box-shadow:0 0 0 18px rgba(178,58,44,0)}}
.word .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word .rank{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:rgba(28,36,48,.07);
  border-radius:6px;padding:1px 7px}
.word h4{margin:0;font-size:23px}
.word .ipa{font-family:var(--mono);font-size:12.5px;color:var(--teal)}
.word .pos{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-style:italic}
.speak{border:1px solid var(--rule-2);background:rgba(255,255,255,.8);border-radius:9px;
  width:28px;height:28px;display:grid;place-items:center;font-size:13px;line-height:1}
.speak:hover{background:var(--teal-soft);border-color:rgba(47,111,104,.4)}
.word .zh{margin:10px 0 2px;font-size:16.5px}
.word .def{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.word .ex{margin:11px 0 0;padding-left:11px;border-left:2px solid var(--rule-2);font-size:15px}
.word .ex em{display:block;font-style:normal;color:var(--ink-3);font-size:13.5px;font-family:var(--body)}
.word .ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ph span{font-size:12.5px;border-radius:999px;border:1px dashed var(--rule-2);padding:2px 9px;background:rgba(255,255,255,.6)}
.ph span b{font-family:var(--mono);font-weight:600;margin-right:5px}
.known-btn{border:1px solid var(--rule-2);background:rgba(255,255,255,.75);border-radius:999px;
  padding:2px 10px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.known-btn[data-known="1"]{background:var(--teal);border-color:var(--teal);color:#fff}
.kept{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.kept button{border:1px solid var(--rule-2);background:rgba(255,255,255,.7);border-radius:8px;padding:3px 10px;font-family:var(--mono);font-size:11px}
.kept button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}

/* Story -------------------------------------------------------- */
.story{border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-2);padding:20px 22px;
  box-shadow:var(--shadow);font-size:17.5px;line-height:1.85}
.story em{font-style:normal;background:linear-gradient(transparent 62%,rgba(185,138,47,.35) 62%);
  border-radius:3px;cursor:pointer;padding:0 1px}
.story em:hover{background:linear-gradient(transparent 45%,rgba(185,138,47,.55) 45%)}
.story .zh{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule-2);color:var(--ink-2);font-size:15.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}

/* Quiz --------------------------------------------------------- */
.quiz{display:grid;gap:12px;margin-top:14px}
.q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--rule);border-radius:11px;
  background:rgba(255,255,255,.6);padding:10px 12px}
.q .idx{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:20px}
.q .ask{font-size:15.5px}
.q input[type=text]{flex:1 1 170px;min-width:130px;padding:7px 10px;border-radius:9px;border:1px solid var(--rule-2);
  background:var(--paper-2);font-family:var(--mono);font-size:14px}
.q .verdict{font-family:var(--mono);font-size:12px;min-width:64px}
.q.ok{border-color:rgba(47,111,104,.5);background:var(--teal-soft)}
.q.no{border-color:rgba(178,58,44,.5);background:var(--seal-soft)}
.q .ans{font-family:var(--mono);font-size:12.5px;color:var(--teal)}

/* Flashcards --------------------------------------------------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(24,30,38,.72);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px}
.overlay[hidden]{display:none}
.card-stage{width:min(560px,100%);text-align:center;color:var(--paper-2)}
.flashcard{perspective:1200px;height:min(52vh,330px);margin-bottom:16px}
.flashcard .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:26px;
  display:grid;place-content:center;gap:10px;background:var(--paper-2);color:var(--ink);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);text-align:left;display:block;overflow-y:auto}
.face .fword{font-family:var(--serif);font-size:clamp(30px,7vw,46px)}
.face .fipa{font-family:var(--mono);font-size:13px;color:var(--teal)}
.face .fzh{font-size:21px;margin-top:6px}
.face .fdef{color:var(--ink-2);font-size:15px;margin-top:6px}
.face .fex{margin-top:12px;padding-left:11px;border-left:2px solid var(--rule-2);font-size:15.5px}
.face .fex em{display:block;font-style:normal;color:var(--ink-3);font-size:13.5px}
.fc-bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.fc-bar .btn{padding:9px 15px}
.fc-count{font-family:var(--mono);font-size:12px;opacity:.85}
.stamp{font-family:var(--mono);font-size:11px;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:2px 9px}

/* Index -------------------------------------------------------- */
.letters{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0}
.letters a,.letters span{font-family:var(--mono);font-size:12px;border:1px solid var(--rule-2);border-radius:7px;
  padding:3px 8px;text-decoration:none;background:rgba(255,255,255,.6)}
.letters span{opacity:.35}
.letter-head{font-family:var(--serif);font-size:22px;margin:24px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ink);display:inline-block}
.ix-row{display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-bottom:1px solid rgba(216,203,180,.6);font-size:15px}
.ix-row a{text-decoration:none;font-family:var(--serif);font-weight:600;font-size:16.5px;min-width:130px}
.ix-row a:hover{color:var(--seal)}
.ix-row .zh{color:var(--ink-2);font-size:14px}
.ix-row .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;opacity:0}
.dot.on{opacity:1}
.notes{border:1px dashed var(--rule-2);border-radius:12px;background:rgba(255,255,255,.55);padding:12px 14px;margin-top:16px}
.notes label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.masked{background:rgba(28,36,48,.14);color:transparent;border-radius:5px;cursor:pointer;transition:background .18s}
.masked *{color:transparent}
.masked:hover,.masked:focus,.word:hover .masked{background:transparent;color:inherit}
.masked:hover *,.masked:focus *,.word:hover .masked *{color:inherit}
.notes textarea{width:100%;min-height:74px;margin-top:8px;border:1px solid var(--rule);border-radius:9px;

.chapter-head{border-left:5px solid var(--seal);padding-left:16px;background:linear-gradient(90deg,var(--tint,rgba(47,111,104,.1)),transparent 70%)}
.menu-btn{display:none}

}
@media (prefers-reduced-motion:reduce){

  body::before,body::after{display:none}
}

ttle house with a garden full of flowers. The view of the sun over the sea was great. I called my sister on the phone to tell her everything. \"Enjoy it and continue,\" she said. The price was not much, and I did nothing but rest. The result: I came home with a happy heart.","sz":"去年夏天，我厌倦了城市生活，想做点什么，于是独自去旅行。每天早上，我都在一座花园里开满鲜花的小房子里吃早餐。太阳升起在海面上的景色美极了。我打电话给妹妹，把一切都告诉了她。“好好享受，继续走吧。”她说。花费不多，我什么也没做，只是休息。结果，我带着一颗快乐的心回到了家。","q":[["Thank you very _____.","much"],["There's _____ in the box.","nothing"],["Can I use your _____?","phone"],["The _____ is too high.","price"],["What was the _____ of the test?","result"]],"block":2,"blockTheme":"人与城市","words":[{"r":241,"lesson":13,"w":"action","b":"action","ipa":"/ˈækʃn/","pos":"n.","zh":"行动；动作","def":"the process of doing something","ee":"We need to take action now.","ez":"我们现在需要采取行动。","ph":[["take action","采取行动"],["action film","动作片"],["Actions speak louder than words.","行动胜于言语。"]]},{"r":242,"lesson":13,"w":"alone","b":"alone","ipa":"/əˈləʊn/","pos":"adj./adv.","zh":"独自；单独的","def":"without other people","ee":"She lives alone.","ez":"她独自生活。","ph":[["leave me alone","别管我"],["let alone","更不用说"]]},{"r":243,"lesson":13,"w":"breakfast","b":"breakfast","ipa":"/ˈbrekfəst/","pos":"n.","zh":"早餐","def":"the first meal of the day","ee":"What did you have for breakfast?","ez":"你早餐吃了什么？","ph":[["have breakfast","吃早餐"],["bed and breakfast","家庭旅馆"]]},{"r":244,"lesson":13,"w":"continue","b":"continue","ipa":"/kənˈtɪnjuː/","pos":"v.","zh":"继续","def":"to keep doing something","ee":"Please continue your story.","ez":"请继续讲你的故事。","ph":[["continue to do","继续做"],["to be continued","未完待续"]]},{"r":245,"lesson":13,"w":"dead","b":"dead","ipa":"/ded/","pos":"adj.","zh":"死的；没电的","def":"not alive; not working","ee":"My phone is dead.","ez":"我手机没电了。","ph":[["dead end","死胡同"],["dead tired","累死了"],["over my dead body","休想"]]},{"r":246,"lesson":13,"w":"enjoy","b":"enjoy","ipa":"/ɪnˈdʒɔɪ/","pos":"v.","zh":"享受，喜欢","def":"to get pleasure from something","ee":"Enjoy your meal!","ez":"请慢用！","ph":[["enjoy yourself","玩得开心"],["enjoy doing","喜欢做"]]},{"r":247,"lesson":13,"w":"full","b":"full","ipa":"/fʊl/","pos":"adj.","zh":"满的；吃饱的","def":"containing as much as possible","ee":"I'm full, thank you.","ez":"我吃饱了，谢谢。","ph":[["be full of","充满"],["in full","全部地"],["full-time","全职的"]]},{"r":248,"lesson":13,"w":"garden","b":"garden","ipa":"/ˈɡɑːdn/","pos":"n.","zh":"花园","def":"land near a house where flowers or vegetables grow","ee":"My grandma works in the garden.","ez":"奶奶在花园里干活。","ph":[["garden party","游园会"],["lead sb up the garden path","误导某人"]]},{"r":249,"lesson":13,"w":"house","b":"house","ipa":"/haʊs/","pos":"n.","zh":"房子","def":"a building where people live","ee":"They bought a new house.","ez":"他们买了一栋新房子。","ph":[["on the house","免费（店家请客）"],["full house","满座"]]},{"r":250,"lesson":13,"w":"journey","b":"journey","ipa":"/ˈdʒɜːni/","pos":"n.","zh":"旅程","def":"travel from one place to another","ee":"Have a safe journey!","ez":"一路平安！","ph":[["go on a journey","去旅行"],["life's journey","人生旅程"]]},{"r":251,"lesson":13,"w":"much","b":"much","ipa":"/mʌtʃ/","pos":"det./adv.","zh":"许多；非常","def":"a lot of (uncountable)","ee":"Thank you very much.","ez":"非常感谢。","ph":[["how much","多少"],["too much","太多"],["not much","不多"]]},{"r":252,"lesson":13,"w":"nothing","b":"nothing","ipa":"/ˈnʌθɪŋ/","pos":"pron.","zh":"没有东西","def":"not anything","ee":"There's nothing in the box.","ez":"盒子里什么都没有。","ph":[["for nothing","免费；徒劳"],["nothing but","只是"],["It's nothing.","没什么。"]]},{"r":253,"lesson":13,"w":"phone","b":"phone","ipa":"/fəʊn/","pos":"n./v.","zh":"电话；手机；打电话","def":"a device for talking to people far away","ee":"Can I use your phone?","ez":"我能用一下你的手机吗？","ph":[["on the phone","在打电话"],["phone call","电话"]]},{"r":254,"lesson":13,"w":"price","b":"price","ipa":"/praɪs/","pos":"n.","zh":"价格","def":"the money you pay for something","ee":"The price is too high.","ez":"价格太高了。","ph":[["at any price","不惜任何代价"],["price tag","价签"]]},{"r":255,"lesson":13,"w":"result","b":"resu _ the book on Friday.","return"],["_____ your work often.","save"],["We swam in the _____.","sea"]],"block":2,"blockTheme":"人与城市","words":[{"r":261,"lesson":14,"w":"against","b":"against","ipa":"/əˈɡenst/","pos":"prep.","zh":"反对；靠着；对抗","def":"opposing; touching; competing with","ee":"I'm against this plan. The bike is against the wall.","ez":"我反对这个计划。自行车靠在墙上。","ph":[["against the law","违法"],["against the clock","争分夺秒"]]},{"r":262,"lesson":14,"w":"bus","b":"bus","ipa":"/bʌs/","pos":"n.","zh":"公共汽车","def":"a large vehicle that carries many passengers","ee":"I go to work by bus.","ez":"我坐公交车上班。","ph":[["bus stop","公交站"],["miss the bus","错过机会"]]},{"r":263,"lesson":14,"w":"company","b":"company","ipa":"/ˈkʌmpəni/","pos":"n.","zh":"公司；陪伴","def":"a business; being with others","ee":"She works for a big company. I enjoy your company.","ez":"她在一家大公司工作。我喜欢和你在一起。","ph":[["keep sb company","陪伴某人"],["in good company","有人作伴"]]},{"r":264,"lesson":14,"w":"desert (n)","b":"desert","ipa":"/ˈdezət/","pos":"n.","zh":"沙漠","def":"a large dry area with sand and little water","ee":"Camels live in the desert.","ez":"骆驼生活在沙漠里。","ph":[["desert island","荒岛"],["注意：dessert /dɪˈzɜːt/ 是“甜点”",""]]},{"r":265,"lesson":14,"w":"expensive","b":"expensive","ipa":"/ɪkˈspensɪv/","pos":"adj.","zh":"昂贵的","def":"costing a lot of money","ee":"This watch is very expensive.","ez":"这块手表很贵。","ph":[["expensive taste","高消费品味"]]},{"r":266,"lesson":14,"w":"flower","b":"flower","ipa":"/ˈflaʊə(r)/","pos":"n.","zh":"花","def":"the coloured part of a plant","ee":"She gave me some flowers.","ez":"她送了我一些花。","ph":[["in flower","开花中"],["flower shop","花店"]]},{"r":267,"lesson":14,"w":"green","b":"green","ipa":"/ɡriːn/","pos":"adj./n.","zh":"绿色的；绿色；环保的","def":"the colour of grass","ee":"The trees are green in summer.","ez":"夏天树木郁郁葱葱。","ph":[["green light","许可，绿灯"],["green with envy","非常嫉妒"],["green hand","新手"]]},{"r":268,"lesson":14,"w":"church","b":"church","ipa":"/tʃɜːtʃ/","pos":"n.","zh":"教堂","def":"a building for Christian worship","ee":"There is an old church in the village.","ez":"村里有一座古老的教堂。","ph":[["go to church","去做礼拜"]]},{"r":269,"lesson":14,"w":"impossible","b":"impossible","ipa":"/ɪmˈpɒsəbl/","pos":"adj.","zh":"不可能的","def":"not able to happen","ee":"Nothing is impossible.","ez":"没有不可能的事。","ph":[["Mission Impossible","不可能的任务"],["make it impossible to","使……成为不可能"]]},{"r":270,"lesson":14,"w":"leave","b":"leave","ipa":"/liːv/","pos":"v./n.","zh":"离开；留下；假期","def":"to go away from; to let something stay","ee":"Don't leave your bag here.","ez":"别把包留在这儿。","ph":[["leave for","动身去"],["leave alone","不打扰"],["sick leave","病假"]]},{"r":271,"lesson":14,"w":"month","b":"month","ipa":"/mʌnθ/","pos":"n.","zh":"月","def":"one of the twelve parts of a year","ee":"I'll see you next month.","ez":"下个月见。","ph":[["once a month","每月一次"],["for months","好几个月"]]},{"r":272,"lesson":14,"w":"on","b":"on","ipa":"/ɒn/","pos":"prep./adv.","zh":"在……上；（日期）在；开着","def":"touching the top of; used with days","ee":"The book is on the desk. See you on Monday.","ez":"书在桌上。周一见。","ph":[["on time","准时"],["go on","继续"],["on and on","不停地"]]},{"r":273,"lesson":14,"w":"plan","b":"plan","ipa":"/plæn/","pos":"n./v.","zh":"计划","def":"an idea of what to do in the future","ee":"What are your plans for the weekend?","ez":"你周末有什么计划？","ph":[["plan to do","打算做"],["Plan B","备用方案"],["go to plan","按计划进行"]]},{"r":274,"lesson":14,"w":"possible","b":"possible","ipa":"/ˈpɒsəbl/","pos":"adj.","zh":"可能的","def":"able to happen","ee":"Come as soon as possible.","ez":"尽快来。","ph":[["as soon as possible (ASAP)","尽快"],["if possible","如果可能的话"]]},{"r":275,"lesson":14,"w":"return","b":"return","ipa":"/rɪˈtɜːn/","pos":"v./n.","zh":"返回；归还","def":"to come or go back; to give back","ee":"Please return the book on Friday.","ez":"请周五还书。","ph":[["in return","作为回报"],["return ticket","往返票"],["Many happy returns!","生日快乐！"]]},{"r":276,"lesson":14,"w":"save","b":"save","ipa":"/seɪv/","pos":"v.","zh":"救；节省；保存","def":"to keep safe; to keep money; to store data","ee":"Save your work often.","ez":"要经常保存你的工作。","ph":[["save money","存钱"],["save time","节省时间"],["save face","保全面子"]]},{"r":277,"lesson":14,"w":"sea","b":"sea","ipa":"/siː/","pos":"n.","zh":"海","def":"a large area of salt water","ee":"We swam in the sea.","ez":"我们在海里游泳。","ph":[["by sea","乘船"],["at sea","在海上；茫然"]]},{"r":278,"lesson":14,"w":"something","b":"something","ipa":"/ˈsʌmθɪŋ/","pos":"pron.","zh":"某事，某物","def":"a thing that is not known or named","ee":"I want to tell you something.","ez":"我想告诉你一件事。","ph":[["something like","大约，类似"],["or something","之类的"]]},{"r":279,"lesson":14,"w":"together","b":"together","ipa":"/təˈɡeðə(r)/","pos":"adv.","zh":"一起","def":"with each other","ee":"Let's work together.","ez":"我们一起努力吧。","ph":[["get together","聚会"],["put together","组装"]]},{"r":280,"lesson":14,"w":"woman","b":"woman","ipa":"/ˈwʊmən/","pos":"n.","zh":"女人，妇女","def":"an adult female person","ee":"That woman is a famous writer.","ez":"那位女士是位知名作家。","ph":[["women（复数）","女人们"],["career woman","职业女性"]]}]},{"n":15,"t":"The Island Culture Club","se":"I am a member of a culture club. Next week we will visit an island. It is a sweet place with a great culture. Our first decision is how to travel. Our leader was in the army, so he knows the best position for each tent. Under the rules, we must try to sleep in a tent. For example, if there is bad weather, we cover the tents. I feel the world is big. The present is a record of the past, and anything can happen.","sz":"我是一个文化俱乐部的成员。下周我们要去一座小岛。那是个美好的地方，文化底蕴深厚。我们要做的第一个决定是怎么去。我们的领队当过兵，所以他知道每顶帐篷最好搭在哪里。按规定，我们得尝试住在帐篷里。例如，天气不好时我们要把帐篷盖好。我觉得世界真大。当下是过去的记录，一切皆有可能。","q":[["He is a _____ of the team.","member"],["See you _____ week.","next"],["He applied for the _____.","position"],["All the students were _____.","present"],["She broke the world _____.","record"]],"block":2,"blockTheme":"人与城市","words":[{"r":281,"lesson":15,"w":"anything","b":"anything","ipa":"/ˈeniθɪŋ/","pos":"pron.","zh":"任何事物","def":"a thing of any kind","ee":"Do you need anything?","ez":"你需要什么吗？","ph":[["anything but","根本不"],["anything else","别的什么"]]},{"r":282,"lesson":15,"w":"army","b":"army","ipa":"/ˈɑːmi/","pos":"n.","zh":"军队","def":"a large group of soldiers","ee":"My uncle was in the army.","ez":"我叔叔当过兵。","ph":[["join the army","参军"],["an army of","一大群"]]},{"r":283,"lesson":15,"w":"bad","b":"bad","ipa":"/bæd/","pos":"adj.","zh":"坏的；严重的","def":"not good","ee":"I have a bad cold.","ez":"我得了重感冒。","ph":[["too bad","太糟了"],["not bad","还不错"],["bad at","不擅长"]]},{"r":284,"lesson":15,"w":"cover","b":"cover","ipa":"/ˈkʌvə(r)/","pos":"v./n.","zh":"覆盖；报道；封面","def":"to put something over; the outside of a book","ee":"Snow covered the ground.","ez":"雪覆盖了大地。","ph":[["cover up","掩盖"],["Don't judge a book by its cover.","人不可貌相。"]]},{"r":285,"lesson":15,"w":"culture","b":"culture","ipa":"/ˈkʌltʃə(r)/","pos":"n.","zh":"文化","def":"the customs, art and ideas of a group","ee":"I love Chinese culture.","ez":"我热爱中国文化。","ph":[["culture shock","文化冲击"],["pop culture","流行文化"]]},{"r":286,"lesson":15,"w":"decision","b":"decision","ipa":"/dɪˈsɪʒn/","pos":"n.","zh":"决定","def":"a choice that you make","ee":"It's a hard decision.","ez":"这是个艰难的决定。","ph":[["make a decision","做决定"],["final decision","最终决定"]]},{"r":287,"lesson":15,"w":"example","b":"example","ipa":"/ɪɡˈzɑːmpl/","pos":"n.","zh":"例子；榜样","def":"a thing that shows what others are like","ee":"Can you give me an example?","ez":"你能举个例子吗？","ph":[["for example","例如"],["set an example","树立榜样"]]},{"r":288,"lesson":15,"w":"feel","b":"feel","ipa":"/fiːl/","pos":"v.","zh":"感觉；觉得；摸","def":"to experience an emotion; to touch","ee":"I feel tired.","ez":"我觉得累了。","ph":[["feel like","想要"],["feel free","随意"],["feel at home","宾至如归"]]},{"r":289,"lesson":15,"w":"how","b":"how","ipa":"/haʊ/","pos":"adv.","zh":"怎样；多么","def":"in what way; to what degree","ee":"How are you?","ez":"你好吗？","ph":[["how about","……怎么样"],["how come","怎么会"],["know-how","专门技能"]]},{"r":290,"lesson":15,"w":"island","b":"island","ipa":"/ˈaɪlənd/","pos":"n.","zh":"岛","de ed","整理床铺"],["get out of bed on the wrong side","起床气"]]},{"r":303,"lesson":16,"w":"buy","b":"buy","ipa":"/baɪ/","pos":"v.","zh":"买","def":"to get something by paying money","ee":"I want to buy a new bike.","ez":"我想买辆新自行车。","ph":[["buy sb a drink","请某人喝一杯"],["buy time","争取时间"],["I don't buy it.","我不信。"]]},{"r":304,"lesson":16,"w":"catch","b":"catch","ipa":"/kætʃ/","pos":"v.","zh":"抓住；赶上；感染","def":"to take hold of; to get on a bus/train in time; to get an illness","ee":"I need to catch the 8 o'clock train.","ez":"我得赶八点的火车。","ph":[["catch a cold","感冒"],["catch up with","赶上"],["Catch you later!","回头见！"]]},{"r":305,"lesson":16,"w":"corner","b":"corner","ipa":"/ˈkɔːnə(r)/","pos":"n.","zh":"角落；拐角","def":"the place where two lines or streets meet","ee":"The shop is on the corner.","ez":"商店就在拐角处。","ph":[["around the corner","即将到来；就在附近"],["cut corners","偷工减料"]]},{"r":306,"lesson":16,"w":"distance","b":"distance","ipa":"/ˈdɪstəns/","pos":"n.","zh":"距离","def":"the amount of space between two places","ee":"What's the distance from here to the station?","ez":"这里到车站有多远？","ph":[["in the distance","在远处"],["keep your distance","保持距离"],["long-distance","长途的"]]},{"r":307,"lesson":16,"w":"education","b":"education","ipa":"/ˌedʒuˈkeɪʃn/","pos":"n.","zh":"教育","def":"teaching and learning","ee":"Education is very important.","ez":"教育非常重要。","ph":[["higher education","高等教育"],["get a good education","受良好教育"]]},{"r":308,"lesson":16,"w":"fast","b":"fast","ipa":"/fɑːst/","pos":"adj./adv.","zh":"快的；快地","def":"quick; quickly","ee":"He runs very fast.","ez":"他跑得很快。","ph":[["fast food","快餐"],["fast asleep","熟睡"],["stand fast","坚定不移"]]},{"r":309,"lesson":16,"w":"here","b":"here","ipa":"/hɪə(r)/","pos":"adv.","zh":"这里","def":"in or to this place","ee":"Come here, please.","ez":"请到这里来。","ph":[["Here you are.","给你。"],["here and there","到处"],["Here we go!","开始了！"]]},{"r":310,"lesson":16,"w":"interest","b":"interest","ipa":"/ˈɪntrəst/","pos":"n./v.","zh":"兴趣；利息；使感兴趣","def":"wanting to know more; extra mon hat you will miss the big game?\" I ask. He smiles: \"Don't worry, I'm good enough. I will remain on the team.\" Then he runs into the garden and kicks the ball far away.","sz":"一个年轻的运动员把他漂亮的自行车放在房子南边的车库里。他是谁？他是我儿子。他不在乎东西的价钱，但他深爱足球。他用一个旧球，每天训练。他不跟人争吵，反而帮助其他队员。“你真的要错过那场大比赛吗？”我问。他笑了：“别担心，我足够好。我会留在队里的。”说完，他跑进花园，把球踢得远远的。","q":[["I missed the bus. I _____ you.","miss"],["Where are the _____ students?","other"],["He is a famous football _____.","player"],["I'd _____ stay at home.","rather"],["Please _____ seated.","remain"]],"block":3,"blockTheme":"社会与工作","words":[{"r":361,"lesson":19,"w":"away","b":"away","ipa":"/əˈweɪ/","pos":"adv.","zh":"离开；在远处","def":"to or at a distance","ee":"Go away! The beach is 5 km away.","ez":"走开！海滩在5公里外。","ph":[["right away","立刻"],["give away","赠送；泄露"],["far away","遥远"]]},{"r":362,"lesson":19,"w":"beautiful","b":"beautiful","ipa":"/ˈbjuːtɪfl/","pos":"adj.","zh":"美丽的","def":"very attractive","ee":"What a beautiful day!","ez":"多么美好的一天！","ph":[["beautiful scenery","美丽的风景"],["Beauty is in the eye of the beholder.","情人眼里出西施。"]]},{"r":363,"lesson":19,"w":"care","b":"care","ipa":"/keə(r)/","pos":"n./v.","zh":"照顾；在乎","def":"attention to keep safe; to feel interest","ee":"Take care!","ez":"保重！","ph":[["take care of","照顾"],["I don't care.","我不在乎。"],["care about","关心"]]},{"r":364,"lesson":19,"w":"cost","b":"cost","ipa":"/kɒst/","pos":"n./v.","zh":"费用；花费","def":"the price; to have a price of","ee":"How much does it cost?","ez":"这个多少钱？","ph":[["at all costs","不惜代价"],["cost of living","生活成本"]]},{"r":365,"lesson":19,"w":"deep","b":"deep","ipa":"/diːp/","pos":"adj./adv.","zh":"深的","def":"going far down","ee":"The river is very deep here.","ez":"这里的河水很深。","ph":[["deep down","内心深处"],["in deep water","陷入困境"],["take a deep breath","深呼吸"]]},{"r":366,"lesson":19,"w":"enough","b":"enough","ipa":"/ɪˈnʌf/","pos":"det./adv.","zh":"足够的；足够地","def":"as much as needed","ee":"Do we have enough time?","ez":"我们时间够吗？","ph":[["Enough is enough.","够了，适可而止。"],["good enough","足够好" __.","report"],["Is this _____ free?","seat"]],"block":3,"blockTheme":"社会与工作","words":[{"r":381,"lesson":20,"w":"already","b":"already","ipa":"/ɔːlˈredi/","pos":"adv.","zh":"已经","def":"before now","ee":"I have already finished my homework.","ez":"我已经完成作业了。","ph":[["already done","已经做完"],["Is it 10 already?","已经十点了？"]]},{"r":382,"lesson":20,"w":"become","b":"become","ipa":"/bɪˈkʌm/","pos":"v.","zh":"成为；变得","def":"to start to be","ee":"She became a doctor.","ez":"她成了一名医生。","ph":[["become of","……的遭遇"],["It becomes clear that...","越来越清楚……"]]},{"r":383,"lesson":20,"w":"cause","b":"cause","ipa":"/kɔːz/","pos":"n./v.","zh":"原因；导致","def":"the reason something happens; to make happen","ee":"Smoking can cause cancer.","ez":"吸烟会致癌。","ph":[["cause and effect","因果"],["good cause","慈善事业"]]},{"r":384,"lesson":20,"w":"certain","b":"certain","ipa":"/ˈsɜːtn/","pos":"adj.","zh":"确定的；某个","def":"sure; particular","ee":"Are you certain? Certain people don't like cats.","ez":"你确定吗？有些人不喜欢猫。","ph":[["for certain","肯定地"],["make certain","确保"],["to a certain extent","在某种程度上"]]},{"r":385,"lesson":20,"w":"describe","b":"describe","ipa":"/dɪˈskraɪb/","pos":"v.","zh":"描述","def":"to say what something is like","ee":"Can you describe the man?","ez":"你能描述一下那个男人吗？","ph":[["describe A as B","把A描述为B"],["hard to describe","难以形容"]]},{"r":386,"lesson":20,"w":"dry","b":"dry","ipa":"/draɪ/","pos":"adj./v.","zh":"干的；干燥的；弄干","def":"without water; to remove water","ee":"Dry your hands with this towel.","ez":"用这条毛巾擦干手。","ph":[["dry up","干涸"],["dry cleaning","干洗"],["high and dry","孤立无援"]]},{"r":387,"lesson":20,"w":"expect","b":"expect","ipa":"/ɪkˈspekt/","pos":"v.","zh":"期待；预期","def":"to think something will happen","ee":"I expect he will come.","ez":"我想他会来的。","ph":[["as expected","不出所料"],["be expecting","怀孕"]]},{"r":388,"lesson":20,"w":"fact","b":"fact","ipa":"/fækt/","pos":"n.","zh":"事实","def":"something that is true","ee":"It's a fact that the earth is round.","ez":"地球是圆的，这是事实。","ph":[["in fact","事实上"],["as a matter of fact","实际上"],["facts of life","现实"]]},{"r":389,"lesson":20,"w":"hard","b":"hard","ipa":"/hɑːd/","pos":"adj./adv.","zh":"硬的；难的；努力地","def":"not soft; difficult; with effort","ee":"He works very hard.","ez":"他工作非常努力。","ph":[["hard work","辛勤工作"],["hard to say","很难说"],["No hard feelings.","不记仇。"]]},{"r":390,"lesson":20,"w":"include","b":"include","ipa":"/ɪnˈkluːd/","pos":"v.","zh":"包括","def":"to have as part of a group","ee":"The price includes breakfast.","ez":"价格包含早餐。","ph":[["including","包括"],["included","包括在内的"]]},{"r":391,"lesson":20,"w":"let","b":"let","ipa":"/let/","pos":"v.","zh":"让，允许","def":"to allow","ee":"Let me help you.","ez":"让我来帮你。","ph":[["Let's go!","我们走吧！"],["let go","放手"],["let down","使失望"]]},{"r":392,"lesson":20,"w":"moment","b":"moment","ipa":"/ˈməʊmənt/","pos":"n.","zh":"片刻；时刻","def":"a very short time","ee":"Wait a moment, please.","ez":"请稍等片刻。","ph":[["at the moment","目前"],["in a moment","马上"],["the moment of truth","关键时刻"]]},{"r":393,"lesson":20,"w":"power","b":"power","ipa":"/ˈpaʊə(r)/","pos":"n.","zh":"力量；权力；电力","def":"strength; control; electricity","ee":"There was no power after the storm.","ez":"暴风雨后停电了。","ph":[["in power","执政"],["power cut","停电"],["Knowledge is power.","知识就是力量。"]]},{"r":394,"lesson":20,"w":"provide","b":"provide","ipa":"/prəˈvaɪd/","pos":"v.","zh":"提供","def":"to give something that is needed","ee":"The hotel provides free Wi-Fi.","ez":"酒店提供免费无线网络。","ph":[["provide sb with sth","向某人提供某物"],["provided that","只要"]]},{"r":395,"lesson":20,"w":"report","b":"report","ipa":"/rɪˈpɔːt/","pos":"n./v.","zh":"报告；报道","def":"an account of something; to tell about","ee":"I need to write a report.","ez":"我需要写一份报告。","ph":[["report to","向……汇报"],["school report","成绩单"]]},{"r":396,"lesson":20,"w":"seat","b":"seat","ipa":"/siːt/","pos":"n.","zh":"座位","def":"a place to sit","ee":"Is this seat free?","ez":"这个座位有人吗？","ph":[["take a seat","请坐"],["window seat","靠窗座位"],["back seat","后座；次要地位"]]},{"r":397,"lesson":20,"w":"single","b":"single","ipa":"/ˈsɪŋɡl/","pos":"adj.","zh":"单一的；单身的；单程的","def":"only one; not married","ee":"Are you married or single?","ez":"你已婚还是单身？","ph":[["single room","单人间"],["every single","每一个"],["single ticket","单程票"]]},{"r":398,"lesson":20,"w":"system","b":"system","ipa":"/ˈsɪstəm/","pos":"n.","zh":"系统；制度","def":"a set of connected things or methods","ee":"The school has a new computer system.","ez":"学校有了新的计算机系统。","ph":[["the system","体制"],["operating system","操作系统"]]},{"r":399,"lesson":20,"w":"through","b":"through","ipa":"/θruː/","pos":"prep./adv.","zh":"穿过；通过；从头到尾","def":"from one side to the other; by means of","ee":"We drove through the tunnel.","ez":"我们开车穿过了隧道。","ph":[["go through","经历；仔细查看"],["through and through","彻头彻尾"]]},{"r":400,"lesson":20,"w":"which","b":"which","ipa":"/wɪtʃ/","pos":"pron./det.","zh":"哪一个；（引导从句）","def":"what one of a group","ee":"Which colour do you like?","ez":"你喜欢哪种颜色？","ph":[["which one","哪一个"],["which is why","这就是为什么"]]}]},{"n":21,"t":"A Rainy Summer Afternoon","se":"It is summer, but today it is a rain day in our small town. I sit by the window and look at the tree outside. The clock says it is just three. I love simple days like this. I eat a blue plate of apple slices and watch a film. My number one pencil is in my hand, and I draw the earth in a different colour. In one quick hour I feel glad and free.","sz":"现在是夏天，但今天我们小镇下着雨。我坐在窗边，望着窗外的树。时钟显示刚好三点。我喜欢这样简单的日子。我吃着蓝色盘子里的苹果片，看了一部电影。手里握着我最喜欢的铅笔，我用不同的颜色画地球。短短一小时，我就觉得开心又自在。","q":[["I _____ you.","love"],["What's your phone _____?","number"],["Can I borrow a _____?","pencil"],["Can I ask a _____ question?","quick"],["It's going to _____.","rain"]],"block":4,"blockTheme":"时间、地点与出行","words":[{"r":401,"lesson":21,"w":"apple","b":"apple","ipa":"/ˈæpl/","pos":"n.","zh":"苹果","def":"a round fruit with red or green skin","ee":"An apple a day keeps the doctor away.","ez":"一天一苹果，医生远离我。","ph":[["the apple of my eye","掌上明珠"],["Big Apple","纽约"]]},{"r":402,"lesson":21,"w":"blue","b":"blue","ipa":"/bluː/","pos":"adj./n.","zh":"蓝色的；忧郁的","def":"the colour of the sky; sad","ee":"I feel a bit blue today.","ez":"我今天有点忧郁。","ph":[["out of the blue","突然"],["once in a blue moon","千载难逢"]]},{"r":403,"lesson":21,"w":"clock","b":"clock","ipa":"/klɒk/","pos":"n.","zh":"时钟","def":"a device that shows the time","ee":"The clock on the wall is slow.","ez":"墙上的钟慢了。","ph":[["around the clock","日夜不停"],["against the clock","争分夺秒"],["alarm clock","闹钟"]]},{"r":404,"lesson":21,"w":"colour","b":"colour","ipa":"/ˈkʌlə(r)/","pos":"n./v.","zh":"颜色；给……着色","def":"red, blue, green, etc.","ee":"What colour is your car?","ez":"你的车是什么颜色的？","ph":[["in colour","彩色的"],["show your true colours","露出真面目"],["美式拼写 color",""]]},{"r":405,"lesson":21,"w":"different","b":"different","ipa":"/ˈdɪfrənt/","pos":"adj.","zh":"不同的","def":"not the same","ee":"My idea is different from yours.","ez":"我的想法和你的不同。","ph":[["different from","与……不同"],["make a difference","有影响"]]},{"r":406,"lesson":21,"w":"earth","b":"earth","ipa":"/ɜːθ/","pos":"n.","zh":"地球；土地","def":"the planet we live on; soil","ee":"The earth goes around the sun.","ez":"地球绕着太阳转。","ph":[["down to earth","脚踏实地"],["on earth","究竟"],["cost the earth","非常昂贵"]]},{"r":407,"lesson":21,"w":"film","b":"film","ipa":"/fɪlm/","pos":"n./v.","zh":"电影；胶卷；拍摄","def":"a movie; to record with a camera","ee":"Let's watch a film tonight.","ez":"我们今晚看电影吧。","ph":[["film star","影星"],["horror film","恐怖片"]]},{"r":408,"lesson":21,"w":"glad","b":"glad","ipa":"/ɡlæd/","pos":"adj.","zh":"高兴的","def":"pleased","ee":"I'm glad to see you.","ez":"很高兴见到你。","ph":[["be glad to","乐意"],["glad to hear that","听到这个很高兴"]]},{"r":409,"lesson":21,"w":"hour","b":"hour","ipa":"/ˈaʊə(r)/","pos":"n.","zh":"小时","def":"60 minutes","ee":"The trip takes two hours.","ez":"这趟旅程需要两小时。","ph":[["rush hour","高峰期"],["for hours","好几个小时"],["office hours","办公时间"]]},{"r":410,"lesson":21,"w":"just","b":"just","ipa":"/dʒʌst/","pos":"adv.","zh":"刚刚；只是；正好","def":"a very short time ago; only; exactly","ee":"I've just arrived. It's just right.","ez":"我刚到。正合适。","ph":[["just in time","恰好及时"],["just a moment","稍等"],["just in case","以防万一"]]},{"r":411,"lesson":21,"w":"love","b":"love","ipa":"/lʌv/","pos":"v./n.","zh":"爱；喜欢","def":"to like very much","ee":"I love you.","ez":"我爱你。","ph":[["fall in love","坠入爱河"],["love at first sight","一见钟情"],["Lots of love","（信末）爱你的"]]},{"r":412,"lesson":21,"w":"number","b":"number","ipa":"/ˈnʌmbə(r)/","pos":"n.","zh":"数字；号码；数量","def":"a word or sign like 1, 2, 3","ee":"What's your phone number?","ez":"你的电话号码是多少？","ph":[["a number of","许多"],["number one","第一"],["wrong number","打错电话"]]},{"r":413,"lesson":21,"w":"pencil","b":"pencil","ipa":"/ˈpensl/","pos":"n.","zh":"铅笔","def":"a tool for writing or drawing","ee":"Can I borrow a pencil?","ez":"能借我一支铅笔吗？","ph":[["pencil case","笔袋"],["pencil in","暂定"]]},{"r":414,"lesson":21,"w":"quick","b":"quick","ipa":"/kwɪk/","pos":"adj.","zh":"快的，迅速的","def":"fast; done in a short time","ee":"Can I ask a quick question?","ez":"我能问个简短的问题吗？","ph":[["quick-tempered","急性子"],["Be quick!","快点！"]]},{"r":415,"lesson":21,"w":"rain","b":"rain","ipa":"/reɪn/","pos":"n./v.","zh":"雨；下雨","def":"water that falls from clouds","ee":"It's going to rain.","ez":"要下雨了。","ph":[["rain or shine","风雨无阻"],["take a rain check","改天吧"]]},{"r":416,"lesson":21,"w":"simple","b":"simple","ipa":"/ˈsɪmpl/","pos":"adj.","zh":"简单的；朴素的","def":"easy; plain","ee":"The answer is simple.","ez":"答案很简单。","ph":[["keep it simple","保持简单"],["simple life","简朴生活"]]},{"r":417,"lesson":21,"w":"summer","b":"summer","ipa":"/ˈsʌmə(r)/","pos":"n.","zh":"夏天","def":"the hottest season of the year","ee":"We go to the beach every summer.","ez":"我们每年夏天去海边。","ph":[["summer holiday","暑假"],["summer camp","夏令营"]]},{"r":418,"lesson":21,"w":"town","b":"town","ipa":"/taʊn/","pos":"n.","zh":"城镇","def":"a place with many houses, smaller than a city","ee":"I grew up in a small town.","ez":"我在一个小镇长大。","ph":[["go to town","大肆挥霍；全力以赴"],["the talk of the town","街谈巷议的话题"]]},{"r":419,"lesson":21,"w":"tree","b":"tree  Then his phone begins to ring. It's Mum: \"Would you ever put your hand in a fire? No? Then pull your foot off the gas!\"","sz":"我和哥哥都痴迷于赛车。我们梦想相似，想法却不同。他想卖掉旧车，买一辆更快的。“我认为速度比安全更重要。”他说。“除非我死了！”妈妈说。我们俩都有一颗爱冒险的心，但我想一定还有别的路可走。我们决定在田野里喝杯茶、吃点肉，好好谈谈。这时他的手机响了。是妈妈：“你会把手伸进火里吗？不会？那就把脚从油门上挪开！”","q":[["Please wait in _____.","line"],["I don't eat much _____.","meat"],["The game is _____.","over"],["_____ the door to open it.","pull"],["They _____ fresh fruit here.","sell"]],"block":4,"blockTheme":"时间、地点与出行","words":[{"r":481,"lesson":25,"w":"another","b":"another","ipa":"/əˈnʌðə(r)/","pos":"det./pron.","zh":"另一个；再一个","def":"one more; a different one","ee":"Can I have another cup?","ez":"能再来一杯吗？","ph":[["one another","互相"],["one after another","一个接一个"],["another day","改天"]]},{"r":482,"lesson":25,"w":"believe","b":"believe","ipa":"/bɪˈliːv/","pos":"v.","zh":"相信；认为","def":"to think something is true","ee":"I believe you.","ez":"我相信你。","ph":[["believe in","信任；信仰"],["Believe it or not","信不信由你"],["I can't believe it!","难以置信！"]]},{"r":483,"lesson":25,"w":"both","b":"both","ipa":"/bəʊθ/","pos":"det./pron.","zh":"两者都","def":"the two","ee":"Both of my parents are teachers.","ez":"我父母都是老师。","ph":[["both... and","……和……都"]]},{"r":484,"lesson":25,"w":"crazy","b":"crazy","ipa":"/ˈkreɪzi/","pos":"adj.","zh":"疯狂的；着迷的","def":"mad; very enthusiastic","ee":"She is crazy about dancing.","ez":"她特别喜欢跳舞。","ph":[["go crazy","发疯"],["drive sb crazy","把某人逼疯"],["like crazy","拼命地"]]},{"r":485,"lesson":25,"w":"cup","b":"cup","ipa":"/kʌp/","pos":"n.","zh":"杯子；奖杯","def":"a small container for drinking","ee":"Would you like a cup of coffee?","ez":"要来杯咖啡吗？","ph":[["cup of tea","一杯茶；喜欢的东西"],["World Cup","世界杯"]]},{"r":486,"lesson":25,"w":"decide","b":"decide","ipa":"/dɪˈsaɪd/","pos":"v.","zh":"决定","def":"to make a choice","ee":"I decided to learn English.","ez":"我决定学英语。","ph":[["decide to do","决定做"],["decide on","选定"]]},{"r":487,"lesson":25,"w":"ever","b":"ever","ipa":"/ˈevə(r)/","pos":"adv.","zh":"曾经；永远","def":"a ./adv.","zh":"在……后面；落后","def":"at the back of","ee":"The garden is behind the house.","ez":"花园在房子后面。","ph":[["behind sb's back","背着某人"],["fall behind","落后"],["leave behind","留下"]]},{"r":523,"lesson":27,"w":"case","b":"case","ipa":"/keɪs/","pos":"n.","zh":"情况；案件；箱子","def":"a situation; a box or bag","ee":"In that case, let's go.","ez":"那样的话，我们走吧。","ph":[["in case","以防"],["in any case","无论如何"],["just in case","以防万一"]]},{"r":524,"lesson":27,"w":"collect","b":"collect","ipa":"/kəˈlekt/","pos":"v.","zh":"收集；接（某人）","def":"to gather things; to pick up","ee":"I collect stamps. I'll collect you at five.","ez":"我集邮。我五点来接你。","ph":[["collect money","募捐"],["collect yourself","镇定下来"]]},{"r":525,"lesson":27,"w":"draw","b":"draw","ipa":"/drɔː/","pos":"v./n.","zh":"画；拉；平局","def":"to make a picture with a pencil; a game with no winner","ee":"Can you draw a cat?","ez":"你会画猫吗？","ph":[["draw a conclusion","得出结论"],["draw attention","吸引注意"],["draw the line","划定界限"]]},{"r":526,"lesson":27,"w":"examine","b":"examine","ipa":"/ɪɡˈzæmɪn/","pos":"v.","zh":"检查；考试","def":"to look at carefully; to test","ee":"The doctor examined my eyes.","ez":"医生检查了我的眼睛。","ph":[["examination (exam)","考试"],["examine closely","仔细检查"]]},{"r":527,"lesson":27,"w":"fall","b":"fall","ipa":"/fɔːl/","pos":"v./n.","zh":"落下；跌倒；秋天（美）","def":"to drop down; autumn (US)","ee":"Be careful not to fall.","ez":"小心别摔倒。","ph":[["fall in love","坠入爱河"],["fall asleep","入睡"],["fall apart","崩溃"]]},{"r":528,"lesson":27,"w":"grow","b":"grow","ipa":"/ɡrəʊ/","pos":"v.","zh":"生长；种植；变得","def":"to become bigger; to plant","ee":"Children grow so fast.","ez":"孩子长得真快。","ph":[["grow up","长大"],["grow old","变老"]]},{"r":529,"lesson":27,"w":"immediately","b":"immediately","ipa":"/ɪˈmiːdiətli/","pos":"adv.","zh":"立刻，马上","def":"at once","ee":"Call me immediately.","ez":"马上给我打电话。","ph":[["immediately after","紧接着"]]},{"r":530,"lesson":27,"w":"low","b":"low","ipa":"/ləʊ/","pos":"adj.","zh":"低的","def":"not high","ee":"The price is very low.","ez":"价格很低。","ph":[["low-key","低调的"],["lie low","避风头"],["feel low","情绪低落"]]},{"r":531,"lesson":27,"w":"mind","b":"mind","ipa":"/maɪnd/","pos":"n./v.","zh":"头脑，思想；介意","def":"your thoughts; to be bothered","ee":"Do you mind if I sit here?","ez":"你介意我坐这儿吗？","ph":[["make up your mind","下定决心"],["Never mind.","没关系。"],["keep in mind","记住"]]},{"r":532,"lesson":27,"w":"off","b":"off","ipa":"/ɒf/","pos":"adv./prep.","zh":"离开；关掉；脱离","def":"away from; not on","ee":"Turn off the light. Take off your coat.","ez":"关灯。脱下外套。","ph":[["day off","休息日"],["get off","下车"],["off and on","断断续续"]]},{"r":533,"lesson":27,"w":"pass","b":"pass","ipa":"/pɑːs/","pos":"v./n.","zh":"经过；通过；传递","def":"to go past; to succeed in a test; to give","ee":"Please pass me the salt. I passed the exam.","ez":"请把盐递给我。我通过了考试。","ph":[["pass away","去世"],["pass by","路过"],["boarding pass","登机牌"]]},{"r":534,"lesson":27,"w":"radio","b":"radio","ipa":"/ˈreɪdiəʊ/","pos":"n.","zh":"收音机；无线电","def":"a device for listening to broadcasts","ee":"I listen to the radio in the car.","ez":"我在车里听广播。","ph":[["on the radio","在广播里"],["radio station","电台"]]},{"r":535,"lesson":27,"w":"shoe","b":"shoe","ipa":"/ʃuː/","pos":"n.","zh":"鞋","def":"a covering for your foot","ee":"These shoes are too small.","ez":"这双鞋太小了。","ph":[["in sb's shoes","设身处地"],["a pair of shoes","一双鞋"]]},{"r":536,"lesson":27,"w":"station","b":"station","ipa":"/ˈsteɪʃn/","pos":"n.","zh":"车站；站，台","def":"a place where trains or buses stop","ee":"Where is the train station?","ez":"火车站在哪里？","ph":[["police station","警察局"],["gas station","加油站"]]},{"r":537,"lesson":27,"w":"sure","b":"sure","ipa":"/ʃʊə(r)/","pos":"adj./adv.","zh":"确定的；当然","def":"certain; of course","ee":"Are you sure? — Sure!","ez":"你确定吗？——当然！","ph":[["make sure","确保"],["for sure","肯定"],["Sure thing!","没问题！"]]},{"r":538,"lesson":27,"w":"test","b":"test","ipa":"/test/","pos":"n./v.","zh":"测试，考试；检验","def":"an exam; to check","ee":"We have a maths test tomorrow.","ez":"我们明天有数学测验。","ph":[["put to the test","接受考验"],["blood test","验血"],["stand the test of time","经得起时间考验"]]},{"r":539,"lesson":27,"w":"usual","b":"usual","ipa":"/ˈjuːʒuəl/","pos":"adj.","zh":"通常的","def":"normal; happening most often","ee":"He was late as usual.","ez":"他像往常一样迟到了。","ph":[["as usual","像往常一样"],["than usual","比平常"]]},{"r":540,"lesson":27,"w":"while","b":"while","ipa":"/waɪl/","pos":"conj./n.","zh":"当……时；然而；一段时间","def":"during the time that; a period","ee":"Wait here for a while.","ez":"在这儿等一会儿。","ph":[["for a while","一会儿"],["once in a while","偶尔"],["worth your while","值得"]]}]},{"n":28,"t":"A Poor Farmer's Chicken","se":"Long ago, a poor man lived along a river at the edge of a forest. He had half a field and one chicken. Sometimes he read an old magazine over his plate of rice. \"Still, I respect nature,\" he said. One fine day, the chicken laid a golden egg! His condition began to increase. But he was sharp: he did not let it change him. When people asked his secret, he gave a direct answer: \"Work hard.\" Would you do the same? That tall story could bear telling again.","sz":"很久以前，一个穷人住在森林边缘的河边。他有半块田和一只鸡。有时他会边吃米饭边看一本旧杂志。“即便如此，我依然尊重大自然。”他说。在一个晴朗的日子，鸡下了一枚金蛋！他的境况开始好转。但他很机敏，没让财富改变自己。人们问他有什么秘诀，他直截了当地回答：“努力工作。”你会这样做吗？这个离奇的故事值得再讲一遍。","q":[["I bought a fashion _____.","magazine"],["I love being in _____.","nature"],["Put the cake on a _____.","plate"],["The _____ dog is hungry. My English is poor.","poor"],["We should _____ our parents.","respect"]],"block":5,"blockTheme":"思考与变化","words":[{"r":541,"lesson":28,"w":"ago","b":"ago","ipa":"/əˈɡəʊ/","pos":"adv.","zh":"以前","def":"before now","ee":"I met him two years ago.","ez":"我两年前遇见了他。","ph":[["long ago","很久以前"],["a while ago","刚才"]]},{"r":542,"lesson":28,"w":"along","b":"along","ipa":"/əˈlɒŋ/","pos":"prep./adv.","zh":"沿着；一起","def":"from one end to the other of; with others","ee":"We walked along the beach.","ez":"我们沿着海滩散步。","ph":[["get along with","与……相处"],["come along","一起来；进展"]]},{"r":543,"lesson":28,"w":"bear","b":"bear","ipa":"/beə(r)/","pos":"n./v.","zh":"熊；忍受；承受","def":"a large wild animal; to accept something bad","ee":"I can't bear the noise.","ez":"我受不了这噪音。","ph":[["bear in mind","记住"],["teddy bear","泰迪熊"],["grin and bear it","逆来顺受"]]},{"r":544,"lesson":28,"w":"condition","b":"condition","ipa":"/kənˈdɪʃn/","pos":"n.","zh":"条件；状况","def":"the state of something; a rule","ee":"The car is in good condition.","ez":"这辆车车况良好。","ph":[["on condition that","只要"],["weather conditions","天气状况"]]},{"r":545,"lesson":28,"w":"direct","b":"direct","ipa":"/dəˈrekt/","pos":"adj./v.","zh":"直接的；指导；导演","def":"straight; to manage; to show the way","ee":"Is there a direct flight to Paris?","ez":"有直飞巴黎的航班吗？","ph":[["direct sb to","给某人指路"],["direct speech","直接引语"]]},{"r":546,"lesson":28,"w":"edge","b":"edge","ipa":"/edʒ/","pos":"n.","zh":"边缘；优势","def":"the outer end of something; an advantage","ee":"Don't stand near the edge.","ez":"别站在边上。","ph":[["on edge","紧张不安"],["cutting-edge","尖端的"],["have the edge","占优势"]]},{"r":547,"lesson":28,"w":"fine","b":"fine","ipa":"/faɪn/","pos":"adj./n.","zh":"好的；晴朗的；罚款","def":"good; healthy; money paid as punishment","ee":"I'm fine, thanks. He paid a fine.","ez":"我很好，谢谢。他交了罚款。","ph":[["fine with me","我没问题"],["fine print","小字条款"]]},{"r":548,"lesson":28,"w":"half","b":"half","ipa":"/hɑːf/","pos":"n./det.","zh":"一半","def":"one of two equal parts","ee":"Cut the apple in half.","ez":"把苹果切成两半。","ph":[["half an hour","半小时"],["half price","半价"],["better half","另一半（配偶）"]]},{"r":549,"lesson":28,"w":"chicken","b":"chicken","ipa":"/ˈtʃɪkɪn/","pos":"n.","zh":"鸡；鸡肉；胆小鬼","def":"a farm bird; its meat; a coward","ee":"We had roast chicken for dinner.","ez":"我们晚饭吃了烤鸡。","ph":[["chicken out","临阵退缩"],["Don't count your chickens before they hatch.","别高兴得太早。"]]},{"r":550,"lesson":28,"w":"increase","b":"increase","ipa":"/ɪnˈkriːs/ v., /ˈɪnkriːs/ n.","pos":"v./n.","zh":"增加","def":"to become bigger in number or amount","ee":"Prices increased by 10%.","ez":"价格上涨了10%。","ph":[["on the increase","在增加"],["increase in","……的增长"]]},{"r":551,"lesson":28,"w":"magazine","b":"magazine","ipa":"/ˌmæɡəˈziːn/","pos":"n.","zh":"杂志","def":"a thin book with articles and pictures","ee":"I bought a fashion magazine.","ez":"我买了一本时尚杂志。","ph":[["weekly magazine","周刊"]]},{"r":552,"lesson":28,"w":"nature","b":"nature","ipa":"/ˈneɪtʃə(r)/","pos":"n.","zh":"自然；本性","def":"plants, animals, landscape; character","ee":"I love being in nature.","ez":"我喜欢待在大自然里。","ph":[["by nature","天生"],["human nature","人性"],["second nature","第二天性"]]},{"r":553,"lesson":28,"w":"plate","b":"plate","ipa":"/pleɪt/","pos":"n.","zh":"盘子","def":"a flat dish for food","ee":"Put the cake on a plate.","ez":"把蛋糕放在盘子里。","ph":[["on your plate","要处理的事"],["license plate","车牌"]]},{"r":554,"lesson":28,"w":"poor","b":"poor","ipa":"/pɔː(r)/","pos":"adj.","zh":"贫穷的；可怜的；差的","def":"having little money; not good","ee":"The poor dog is hungry. My English is poor.","ez":"可怜的狗饿了。我的英语很差。","ph":[["the poor","穷人"],["poor thing","可怜的家伙"]]},{"r":555,"lesson":28,"w":"respect","b":"respect","ipa":"/rɪˈspekt/","pos":"n./v.","zh":"尊重；方面","def":"admiration; to admire","ee":"We should respect our parents.","ez":"我们应该尊重父母。","ph":[["with respect to","关于"],["in this respect","在这方面"],["pay respect","致敬"]]},{"r":556,"lesson":28,"w":"sharp","b":"sharp","ipa":"/ʃɑːp/","pos":"adj./adv.","zh":"锋利的；敏锐的；准时","def":"able to cut; clever; exactly","ee":"Be careful, the knife is sharp. Meet at 8 sharp.","ez":"小心，刀很锋利。八点整见。","ph":[["sharp mind","敏锐的头脑"],["look sharp","赶快"]]},{"r":557,"lesson":28,"w":"sometimes","b":"sometimes","ipa":"/ˈsʌmtaɪmz/","pos":"adv.","zh":"有时","def":"on some occasions","ee":"Sometimes I walk to school.","ez":"有时我走路上学。","ph":[["sometimes... sometimes...","时而……时而……"]]},{"r":558,"lesson":28,"w":"still","b":"still","ipa":"/stɪl/","pos":"adv./adj.","zh":"仍然；静止的","def":"continuing; not moving","ee":"Are you still here? Keep still.","ez":"你还在这儿？别动。","ph":[["still life","静物画"],["Still waters run deep.","静水流深。"]]},{"r":559,"lesson":28,"w":"tall","b":"tall","ipa":"/tɔːl/","pos":"adj.","zh":"高的","def":"having great height","ee":"He is very tall.","ez":"他个子很高。","ph":[["tall story","难以置信的故事"],["a tall order","艰巨的任务"]]},{"r":560,"lesson":28,"w":"would","b":"would","ipa":"/wʊd/","pos":"modal v.","zh":"将会；愿意（礼貌）","def":"past of will; used in polite requests","ee":"Would you like some tea?","ez":"你想喝点茶吗？","ph":[["would like","想要"],["would rather","宁愿"],["Would you mind...?","你介意……吗？"]]}]},{"n":29,"t":"The Early Bird Patient","se":"Early in the morning, a patient comes to check in at the clinic. He has a red mark on his arm. \"My state is not good. Perhaps a fly bit me,\" he says. \"Let me introduce myself. I am Dr. Lee. It depends on the tests.\" Among the common problems, this one is less serious. \"Your temperature will rise for a short time, then turn normal. I will add some medicine. You are built strong, so you will be fine.\" It makes sense. Things happen!","sz":"一大早，一位病人来诊所挂号。他手臂上有一个红印。“我状态不太好，也许是被苍蝇咬了。”他说。“我先自我介绍一下，我是李医生。这要看检查结果。”在常见问题里，这个不算严重。“你的体温会短暂升高，然后恢复正常。我给你加点药。你体格强壮，会没事的。”这很合理。事情总会发生的！","q":[["I want to spend _____ money.","less"],["Be _____ with children.","patient"],["_____ it will rain tomorrow.","perhaps"],["That makes _____.","sense"],["I'm _____ of money.","short"]],"block":5,"blockTheme":"思考与变化","words":[{"r":561,"lesson":29,"w":"add","b":"add","ipa":"/æd/","pos":"v.","zh":"加；增加；补充说","def":"to put together; to say more","ee":"Add some salt to the soup.","ez":"往汤里加点盐。","ph":[["add up","加起来；说得通"],["add to","增加"],["add-on","附加物"]]},{"r":562,"lesson":29,"w":"among","b":"among","ipa":"/əˈmʌŋ/","pos":"prep.","zh":"在……之中（三者以上）","def":"in the middle of a group","ee":"She is popular among students.","ez":"她在学生中很受欢迎。","ph":[["among others","其中包括"],["among friends","在朋友之间"]]},{"r":563,"lesson":29,"w":"built","b":"built","ipa":"/bɪlt/","pos":"v./adj.","zh":"建造（build 的过去式/过去分词）；体格……的","def":"past of build; having a body shape","ee":"The bridge was built in 1990.","ez":"这座桥建于1990年。","ph":[["well-built","身材健壮的"],["built-in","内置的"]]},{"r":564,"lesson":29,"w":"common","b":"common","ipa":"/ˈkɒmən/","pos":"adj.","zh":"常见的；共同的","def":"happening often; shared","ee":"It's a common mistake.","ez":"这是一个常见错误。","ph":[["in common","共同的"],["common sense","常识"],["common ground","共同点"]]},{"r":565,"lesson":29,"w":"depend","b":"depend","ipa":"/dɪˈpend/","pos":"v.","zh":"依靠；取决于","def":"to need; to be decided by","ee":"It depends on the weather.","ez":"那要看天气。","ph":[["It depends.","看情况。"],["depend on","依靠；取决于"]]},{"r":566,"lesson":29,"w":"early","b":"early","ipa":"/ˈɜːli/","pos":"adj./adv.","zh":"早的；早地","def":"near the beginning; before the usual time","ee":"I get up early.","ez":"我起得早。","ph":[["The early bird catches the worm.","早起的鸟儿有虫吃。"],["early on","早期"]]},{"r":567,"lesson":29,"w":"fly","b":"fly","ipa":"/flaɪ/","pos":"v./n.","zh":"飞；乘飞机；苍蝇","def":"to move through the air","ee":"We flew to Beijing.","ez":"我们飞到了北京。","ph":[["Time flies.","时光飞逝。"],["fly off the handle","大发雷霆"]]},{"r":568,"lesson":29,"w":"happen","b":"happen","ipa":"/ˈhæpən/","pos":"v.","zh":"发生；碰巧","def":"to take place; by chance","ee":"What happened?","ez":"发生什么事了？","ph":[["happen to do","碰巧做"],["Accidents happen.","意外在所难免。"]]},{"r":569,"lesson":29,"w":"check","b":"check","ipa":"/tʃek/","pos":"v./n.","zh":"检查；核对；账单","def":"to make sure; the bill (US)","ee":"Check your answers. Can we have the check?","ez":"检查你的答案。能给我们账单吗？","ph":[["check in","办理入住/登机"],["check out","退房；看看"],["double-check","复查"]]},{"r":570,"lesson":29,"w":"introduce","b":"introduce","ipa":"/ˌɪntrəˈdjuːs/","pos":"v.","zh":"介绍；引进","def":"to tell people each other's names; to bring in","ee":"Let me introduce my friend.","ez":"让我介绍一下我的朋友。","ph":[["introduce yourself","自我介绍"],["introduce A to B","把A介绍给B"]]},{"r":571,"lesson":29,"w":"less","b":"less","ipa":"/les/","pos":"det./adv.","zh":"较少的；较少","def":"a smaller amount","ee":"I want to spend less money.","ez":"我想少花点钱。","ph":[["less and less","越来越少"],["more or less","或多或少"],["no less than","多达"]]},{"r":572,"lesson":29,"w":"mark","b":"mark","ipa":"/mɑːk/","pos":"n./v.","zh":"记号；分数；标记","def":"a sign or spot; a score","ee":"She got full marks.","ez":"她得了满分。","ph":[["On your marks!","各就各位！"],["leave a mark","留下印记"],["question mark","问号"]]},{"r":573,"lesson":29,"w":"patient","b":"patient","ipa":"/ˈpeɪʃnt/","pos":"n./adj.","zh":"病人；有耐心的","def":"a person who is ill; able to wait calmly","ee":"Be patient with children.","ez":"对孩子要有耐心。","ph":[["patience","耐心"],["outpatient","门诊病人"]]},{"r":574,"lesson":29,"w":"perhaps","b":"perhaps","ipa":"/pəˈhæps/","pos":"adv.","zh":"也许","def":"maybe","ee":"Perhaps it will rain tomorrow.","ez":"明天也许会下雨。","ph":[["perhaps not","也许不"]]},{"r":575,"lesson":29,"w":"rise","b":"rise","ipa":"/raɪz/","pos":"v./n.","zh":"升起；上涨","def":"to go up","ee":"The sun rises in the east.","ez":"太阳从东方升起。","ph":[["rise and shine","起床啦"],["on the rise","在上升"],["give rise to","引起"]]},{"r":576,"lesson":29,"w":"sense","b":"sense","ipa":"/sens/","pos":"n./v.","zh":"感觉；意义；感觉到","def":"one of the five abilities (sight, etc.); meaning","ee":"That makes sense.","ez":"有道理。","ph":[["common sense","常识"],["sense of humour","幽默感"],["in a sense","从某种意义上说"]]},{"r":577,"lesson":29,"w":"short","b":"short","ipa":"/ʃɔːt/","pos":"adj.","zh":"短的；矮的；缺少的","def":"not long; not tall","ee":"I'm short of money.","ez":"我缺钱。","ph":[["in short","总之"],["short for","……的缩写"],["run short of","快用完"]]},{"r":578,"lesson":29,"w":"state","b":"state","ipa":"/steɪt/","pos":"n./v.","zh":"状态；州；国家；陈述","def":"a condition; part of a country; to say formally","ee":"The house is in a bad state.","ez":"房子状况很糟。","ph":[["state of mind","心态"],["the United States","美国"],["state-of-the-art","最先进的"]]},{"r":579,"lesson":29,"w":"turn","b":"turn","ipa":"/tɜːn/","pos":"v./n.","zh":"转动；变成；轮流","def":"to move around; to become; a chance to do","ee":"Turn left. It's your turn.","ez":"向左转。轮到你了。","ph":[["turn on/off","打开/关闭"],["take turns","轮流"],["turn down","拒绝；调低"]]},{"r":580,"lesson":29,"w":"will","b":"will","ipa":"/wɪl/","pos":"modal v./n.","zh":"将；意志；遗嘱","def":"used for the future; strong wish","ee":"I will call you tomorrow.","ez":"我明天给你打电话。","ph":[["Where there's a will, there's a way.","有志者事竟成。"],["free will","自由意志"],["against your will","违背意愿"]]}]},{"n":30,"t":"A Short War Story","se":"Once upon a time, two countries were at war. The court had to discuss a new form of action. \"What is the purpose of fighting?\" asked a young soldier. \"Though we hold our land, it is really a bad situation,\" he said. The king said nothing at first. Then he took a ride to the border. He saw an insect appear on his hand, and its effect on him was great. \"Even this small life means something,\" he said. \"Let's act now and break this circle.\" Peace came, and it was a success.","sz":"从前，两个国家正在打仗。朝廷不得不商讨一种新的行动方式。“打仗的目的是什么？”一个年轻士兵问。“尽管我们守住了土地，但处境真的很糟。”他说。国王起初什么也没说。后来，他骑马去了边境。他看到一只小虫出现在自己手上，这对他触动很大。“就连这个小生命也有意义。”他说，“让我们现在就行动，打破这个循环。”和平到来了，这是一次成功。","q":[["What does this word _____? Don't be mean.","mean"],["I've been there _____. Once upon a time...","once"],["What's the _____ of your visit?","purpose"],["I _____ like it. Really?","really"],["Can you _____ a bike? Give me a ride.","ride"]],"block":5,"blockTheme":"思考与变化","words":[{"r":581,"lesson":30,"w":"act","b":"act","ipa":"/ækt/","pos":"v./n.","zh":"行动；表演；法案","def":"to do something; to perform","ee":"We must act now. She acts in films.","ez":"我们必须现在行动。她演电影。","ph":[["act as","担任"],["act like","表现得像"],["in the act","当场"]]},{"r":582,"lesson":30,"w":"appear","b":"appear","ipa":"/əˈpɪə(r)/","pos":"v.","zh":"出现；似乎","def":"to come into sight; to seem","ee":"A man appeared at the door. She appears tired.","ez":"一个男人出现在门口。她看上去很累。","ph":[["appear on TV","上电视"],["It appears that...","似乎……"]]},{"r":583,"lesson":30,"w":"break","b":"break","ipa":"/breɪk/","pos":"v./n.","zh":"打破；休息","def":"to make something go into pieces; a short rest","ee":"Let's take a break.","ez":"我们休息一下吧。","ph":[["break down","出故障"],["break up","分手"],["break the ice","打破僵局"]]},{"r":584,"lesson":30,"w":"course","b":"course","ipa":"/kɔːs/","pos":"n.","zh":"课程；过程；一道菜","def":"a set of classes; a part of a meal","ee":"I'm taking an English course.","ez":"我在上一门英语课程。","ph":[["of course","当然"],["main course","主菜"],["in the course of","在……过程中"]]},{"r":585,"lesson":30,"w":"court","b":"court","ipa":"/kɔːt/","pos":"n.","zh":"法院；球场；宫廷","def":"a place where legal cases are decided; a sports area","ee":"The case went to court.","ez":"这个案子告上了法庭。","ph":[["tennis court","网球场"],["take sb to court","起诉某人"]]},{"r":586,"lesson":30,"w":"discuss","b":"discuss","ipa":"/dɪˈskʌs/","pos":"v.","zh":"讨论","def":"to talk about something with others","ee":"Let's discuss the plan.","ez":"我们来讨论一下这个计划。","ph":[["discussion","讨论"],["under discussion","在讨论中"]]},{"r":587,"lesson":30,"w":"effect","b":"effect","ipa":"/ɪˈfekt/","pos":"n.","zh":"效果；影响","def":"a result or change","ee":"The medicine had a good effect.","ez":"这种药效果很好。","ph":[["have an effect on","对……有影响"],["side effect","副作用"],["in effect","实际上"]]},{"r":588,"lesson":30,"w":"form","b":"form","ipa":"/fɔːm/","pos":"n./v.","zh":"形式；表格；形成","def":"a type; a paper with spaces to fill; to make","ee":"Please fill in this form.","ez":"请填写这张表格。","ph":[["in the form of","以……形式"],["fill in a form","填表"],["in good form","状态好"]]},{"r":589,"lesson":30,"w":"hold","b":"hold","ipa":"/həʊld/","pos":"v./n.","zh":"拿着；举行；容纳","def":"to have in your hand; to have a meeting","ee":"Hold my hand. Hold on, please.","ez":"握住我的手。请稍等。","ph":[["hold on","稍等；坚持"],["hold up","耽搁"],["get hold of","联系上"]]},{"r":590,"lesson":30,"w":"insect","b":"insect","ipa":"/ˈɪnsekt/","pos":"n.","zh":"昆虫","def":"a small animal with six legs","ee":"Bees are insects.","ez":"蜜蜂是昆虫。","ph":[["insect bite","虫咬"]]},{"r":591,"lesson":30,"w":"mean","b":"mean","ipa":"/miːn/","pos":"v./adj.","zh":"意思是；打算；吝啬的；刻薄的","def":"to have a meaning; unkind","ee":"What does this word mean? Don't be mean.","ez":"这个词是什么意思？别这么刻薄。","ph":[["I mean","我的意思是"],["mean to do","打算做"],["meaning","意义"]]},{"r":592,"lesson":30,"w":"once","b":"once","ipa":"/wʌns/","pos":"adv./conj.","zh":"一次；曾经；一旦","def":"one time; in the past; as soon as","ee":"I've been there once. Once upon a time...","ez":"我去过那里一次。从前……","ph":[["at once","立刻"],["once again","再一次"],["once in a while","偶尔"]]},{"r":593,"lesson":30,"w":"purpose","b":"purpose","ipa":"/ˈpɜːpəs/","pos":"n.","zh":"目的","def":"the reason for doing something","ee":"What's the purpose of your visit?","ez":"你来访的目的是什么？","ph":[["on purpose","故意地"],["serve a purpose","有用"]]},{"r":594,"lesson":30,"w":"really","b":"really","ipa":"/ˈriːəli/","pos":"adv.","zh":"真正地；非常","def":"truly; very","ee":"I really like it. Really?","ez":"我真的很喜欢。真的吗？","ph":[["not really","不完全是"],["Really!","真是的！"]]},{"r":595,"lesson":30,"w":"ride","b":"ride","ipa":"/raɪd/","pos":"v./n.","zh":"骑；乘坐","def":"to sit on and control a bike or horse; a trip","ee":"Can you ride a bike? Give me a ride.","ez":"你会骑自行车吗？载我一程。","ph":[["take sb for a ride","欺骗某人"],["ride out","安然渡过"]]},{"r":596,"lesson":30,"w":"situation","b":"situation","ipa":"/ˌsɪtʃuˈeɪʃn/","pos":"n.","zh":"形势，处境","def":"what is happening at a particular time","ee":"The situation is getting worse.","ez":"情况越来越糟。","ph":[["in this situation","在这种情况下"],["win-win situation","双赢局面"]]},{"r":597,"lesson":30,"w":"success","b":"success","ipa":"/səkˈses/","pos":"n.","zh":"成功","def":"achieving what you want","ee":"The party was a great success.","ez":"这次派对非常成功。","ph":[["Nothing succeeds like success.","一顺百顺。"],["key to success","成功的关键"]]},{"r":598,"lesson":30,"w":"though","b":"though","ipa":"/ðəʊ/","pos":"conj./adv.","zh":"虽然；不过","def":"despite the fact that; however","ee":"Though it was cold, we went out.","ez":"虽然天冷，我们还是出去了。","ph":[["even though","即使"],["as though","好像"]]},{"r":599,"lesson":30,"w":"upon","b":"upon","ipa":"/əˈpɒn/","pos":"prep.","zh":"在……上（较正式）","def":"on (formal)","ee":"Once upon a time, there lived a king.","ez":"从前，有一位国王。","ph":[["once upon a time","从前"],["upon arrival","一到达就"]]},{"r":600,"lesson":30,"w":"war","b":"war","ipa":"/wɔː(r)/","pos":"n.","zh":"战争","def":"fighting between countries","ee":"The war lasted five years.","ez":"战争持续了五年。","ph":[["at war","处于战争中"],["world war","世界大战"],["war of words","口水战"]]}]},{"n":31,"t":"A Busy Week","se":"Yesterday was a busy day, and tomorrow will be the same. This afternoon I have a music lesson, and then I need to finish a request from my boss. But I'm sick of work! So I make a choice: I will take a holiday this season. I make a cup of coffee in the kitchen and eat an orange. Every detail is perfect. Welcome, free time! Especially on the ground of a sunny beach.","sz":"昨天很忙，明天也一样。今天下午我有一节音乐课，然后还要完成老板交代的任务。可我已经厌倦工作了！所以我做了一个选择：这个季节我要去度假。我在厨房煮了杯咖啡，吃了个橙子。每个细节都很完美。欢迎你，空闲时光！尤其是在阳光灿烂的沙滩上。","q":[["I have a piano _____ today.","lesson"],["What kind of _____ do you like?","music"],["Would you like an _____?","orange"],["Your English is _____!","perfect"],["I have a small _____.","request"]],"block":6,"blockTheme":"生活场景","words":[{"r":601,"lesson":31,"w":"afternoon","b":"afternoon","ipa":"/ˌɑːftəˈnuːn/","pos":"n.","zh":"下午","def":"the time from midday to evening","ee":"Good afternoon!","ez":"下午好！","ph":[["in the afternoon","在下午"],["afternoon tea","下午茶"]]},{"r":602,"lesson":31,"w":"busy","b":"busy","ipa":"/ˈbɪzi/","pos":"adj.","zh":"忙的；繁忙的","def":"having a lot to do; full of people","ee":"I'm busy right now. The street is busy.","ez":"我现在很忙。街上很热闹。","ph":[["busy with","忙于"],["busy doing","忙着做"],["The line is busy.","电话占线。"]]},{"r":603,"lesson":31,"w":"coffee","b":"coffee","ipa":"/ˈkɒfi/","pos":"n.","zh":"咖啡","def":"a hot drink made from coffee beans","ee":"Let's have a coffee.","ez":"我们喝杯咖啡吧。","ph":[["coffee break","咖啡时间，工间休息"],["coffee shop","咖啡店"]]},{"r":604,"lesson":31,"w":"detail","b":"detail","ipa":"/ˈdiːteɪl/","pos":"n.","zh":"细节","def":"a small fact or part","ee":"Please give me more details.","ez":"请给我更多细节。","ph":[["in detail","详细地"],["pay attention to detail","注重细节"],["The devil is in the details.","细节决定成败。"]]},{"r":605,"lesson":31,"w":"especially","b":"especially","ipa":"/ɪˈspeʃəli/","pos":"adv.","zh":"尤其，特别","def":"more than usual; particularly","ee":"I love fruit, especially apples.","ez":"我喜欢水果，尤其是苹果。","ph":[["especially for","专门为"]]},{"r":606,"lesson":31,"w":"finish","b":"finish","ipa":"/ˈfɪnɪʃ/","pos":"v./n.","zh":"完成，结束","def":"to end; to complete","ee":"Have you finished your homework?","ez":"你作业做完了吗？","ph":[["finish doing","做完"],["finish line","终点线"],["from start to finish","自始至终"]]},{"r":607,"lesson":31,"w":"ground","b":"ground","ipa":"/ɡraʊnd/","pos":"n.","zh":"地面；场地；理由","def":"the surface of the earth; a reason","ee":"The ground is wet.","ez":"地面是湿的。","ph":[["on the ground","在地上；在现场"],["ground floor","一楼"],["common ground","共同点"]]},{"r":608,"lesson":31,"w":"holiday","b":"holiday","ipa":"/ˈhɒlədeɪ/","pos":"n.","zh":"假期，节日","def":"a time when you don't work or study","ee":"We're going on holiday next week.","ez":"我们下周去度假。","ph":[["on holiday","在度假"],["public holiday","公众假期"],["summer holiday","暑假"]]},{"r":609,"lesson":31,"w":"choice","b":"choice","ipa":"/tʃɔɪs/","pos":"n.","zh":"选择","def":"the act of choosing; something chosen","ee":"You have no choice.","ez":"你别无选择。","ph":[["make a choice","做选择"],["by choice","自愿地"],["multiple choice","多项选择"]]},{"r":610,"lesson":31,"w":"kitchen","b":"kitchen","ipa":"/ˈkɪtʃɪn/","pos":"n.","zh":"厨房","def":"a room where you cook","ee":"Mum is cooking in the kitchen.","ez":"妈妈在厨房做饭。","ph":[["kitchen table","餐桌"],["Too many cooks spoil the broth.","厨子多了烧坏汤。"]]},{"r":611,"lesson":31,"w":"lesson","b":"lesson","ipa":"/ˈlesn/","pos":"n.","zh":"课；教训","def":"a period of teaching; something learned from experience","ee":"I have a piano lesson today.","ez":"我今天有钢琴课。","ph":[["learn a lesson","吸取教训"],["teach sb a lesson","给某人一个教训"]]},{"r":612,"lesson":31,"w":"music","b":"music","ipa":"/ˈmjuːzɪk/","pos":"n.","zh":"音乐","def":"sounds made by voices or instruments","ee":"What kind of music do you like?","ez":"你喜欢哪种音乐？","ph":[["listen to music","听音乐"],["face the music","承担后果"],["music to my ears","好消息"]]},{"r":613,"lesson":3 }]},{"n":32,"t":"Weather and a Date","se":"I have a date with a smart gentleman tomorrow, so I check the weather: blue sky, no plane delays. We will meet at the bridge and enter a private restaurant near the market; its size is small but perfect. He agrees to try the local cake. His hair is short and he speaks my language. \"Thank you for coming,\" he says. Our future? Who knows, but the image of that day stays with me. The customer is always right, even on a date!","sz":"我明天要和一位聪明的绅士约会，所以查了查天气：蓝天白云，飞机也不会延误。我们会在桥边见面，然后走进市场附近一家私房餐厅；店面不大，但很完美。他同意尝尝当地的蛋糕。他留着短发，会说我的语言。“谢谢你能来。”他说。我们的未来？谁知道呢，但那天的画面一直留在我心里。顾客永远是对的，约会时也一样！","q":[["I buy vegetables at the _____.","market"],["The _____ takes off at noon.","plane"],["This is a _____ matter.","private"],["Let's eat at a _____ tonight.","restaurant"],["What _____ shoes do you wear?","size"]],"block":6,"blockTheme":"生活场景","words":[{"r":621,"lesson":32,"w":"agree","b":"agree","ipa":"/əˈɡriː/","pos":"v.","zh":"同意","def":"to have the same opinion","ee":"I agree with you.","ez":"我同意你的看法。","ph":[["agree to","同意（计划）"],["agree on","就……达成一致"],["agree to disagree","求同存异"]]},{"r":622,"lesson":32,"w":"bridge","b":"bridge","ipa":"/brɪdʒ/","pos":"n.","zh":"桥","def":"a structure over a river or road","ee":"We walked across the bridge.","ez":"我们走过了桥。","ph":[["cross that bridge when you come to it","到时候再说"],["burn your bridges","自断后路"]]},{"r":623,"lesson":32,"w":"cake","b":"cake","ipa":"/keɪk/","pos":"n.","zh":"蛋糕","def":"a sweet food made from flour, eggs and sugar","ee":"She made a chocolate cake.","ez":"她做了一个巧克力蛋糕。","ph":[["a piece of cake","小菜一碟"],["have your cake and eat it","鱼与熊掌兼得"]]},{"r":624,"lesson":32,"w":"customer","b":"customer","ipa":"/ˈkʌstəmə(r)/","pos":"n.","zh":"顾客","def":"a person who buys things","ee":"The customer is always right.","ez":"顾客永远是对的。","ph":[["customer service","客户服务"],["regular customer","老顾客"]]},{"r":625,"lesson":32,"w":"date","b":"date","ipa":"/deɪt/","pos":"n./v.","zh":"日期；约会；枣","def":"a day of the month; a r r and some salt. He wears a thick coat made of cloth. Last year, an actor wanted to improve his skill. My uncle showed him every plant and pointed with his finger everywhere. Nothing could destroy his calm.","sz":"我叔叔冬天是一位特别的向导。他教人们穿越广阔的雪海。他说：“每个错误都是一课，别再犯。”他随身带着一把刀、一瓶水和一些盐。他穿着一件厚厚的布外套。去年，一位演员想提升自己的技能。我叔叔给他介绍了每一种植物，用手指指点各处。没有什么能打破他的镇定。","q":[["A _____ coffee, please.","large"],["The Pacific _____ is the largest ocean.","ocean"],["Could you _____ that, please?","repeat"],["Pass me the _____, please.","salt"],["Today is a _____ day.","special"]],"block":6,"blockTheme":"生活场景","words":[{"r":641,"lesson":33,"w":"actor","b":"actor","ipa":"/ˈæktə(r)/","pos":"n.","zh":"演员","def":"a person who acts in films or plays","ee":"He is a famous actor.","ez":"他是著名演员。","ph":[["actress","女演员"],["leading actor","男主角"]]},{"r":642,"lesson":33,"w":"bottle","b":"bottle","ipa":"/ˈbɒtl/","pos":"n.","zh":"瓶子","def":"a glass or plastic container for liquids","ee":"A bottle of water, please.","ez":"请给我一瓶水。","ph":[["bottle up","压抑（情感）"],["hit the bottle","酗酒"]]},{"r":643,"lesson":33,"w":"cloth","b":"cloth","ipa":"/klɒθ/","pos":"n.","zh":"布；抹布","def":"material made from cotton, wool, etc.","ee":"Clean the table with a cloth.","ez":"用抹布擦桌子。","ph":[["tablecloth","桌布"],["注意 clothes","衣服"]]},{"r":644,"lesson":33,"w":"coat","b":"coat","ipa":"/kəʊt/","pos":"n.","zh":"外套","def":"a piece of clothing worn over others","ee":"Put on your coat; it's cold.","ez":"穿上外套，天冷。","ph":[["winter coat","冬衣"],["a coat of paint","一层油漆"]]},{"r":645,"lesson":33,"w":"destroy","b":"destroy","ipa":"/dɪˈstrɔɪ/","pos":"v.","zh":"破坏，摧毁","def":"to damage completely","ee":"The fire destroyed the house.","ez":"大火烧毁了房子。","ph":[["destroy evidence","销毁证据"]]},{"r":646,"lesson":33,"w":"everywhere","b":"everywhere","ipa":"/ˈevriweə(r)/","pos":"adv.","zh":"到处","def":"in all places","ee":"I looked everywhere for you.","ez":"我到处找你。","ph":[["everywhere you go","你所到之处"]]},{"r":647,"lesson":33,"w":"finger","b":"finger","ipa":"/ˈfɪŋɡə(r)/","po
