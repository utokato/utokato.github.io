"跟我读"],["History repeats itself.","历史总是重演。"]]},{"r":656,"lesson":33,"w":"salt","b":"salt","ipa":"/sɔːlt/","pos":"n.","zh":"盐","def":"a white substance used to flavour food","ee":"Pass me the salt, please.","ez":"请把盐递给我。","ph":[["take with a grain of salt","半信半疑"],["the salt of the earth","社会中坚，好人"]]},{"r":657,"lesson":33,"w":"special","b":"special","ipa":"/ˈspeʃl/","pos":"adj.","zh":"特别的","def":"different from usual; important","ee":"Today is a special day.","ez":"今天是个特别的日子。","ph":[["nothing special","没什么特别"],["special offer","特价"]]},{"r":658,"lesson":33,"w":"teach","b":"teach","ipa":"/tiːtʃ/","pos":"v.","zh":"教","def":"to help someone learn","ee":"She teaches maths.","ez":"她教数学。","ph":[["teach sb a lesson","给某人一个教训"],["You can't teach an old dog new tricks.","老狗学不了新把戏。"]]},{"r":659,"lesson":33,"w":"uncle","b":"uncle","ipa":"/ˈʌŋkl/","pos":"n.","zh":"叔叔，舅舅，伯伯","def":"the brother of your parent","ee":"My uncle lives in Canada.","ez":"我叔叔住在加拿大。","ph":[["Bob's your uncle!","就这么简单！"]]},{"r":660,"lesson":33,"w":"winter","b":"winter","ipa":"/ˈwɪntə(r)/","pos":"n.","zh":"冬天","def":"the coldest season","ee":"It snows a lot in winter.","ez":"冬天经常下雪。","ph":[["winter holiday","寒假"],["in the dead of winter","隆冬时节"]]}]},{"n":34,"t":"A Strange Hotel","se":"We stayed at a cheap hotel. It seemed nice, but it was strange: the room was dirty and there was a gas smell. I was angry. The next day I read an article about a famous man who had been in prison. Now he works at this hotel! He prepared rice for us and was very warm, and his wife, in a long skirt, brought tea. In an interview he said, \"Everyone can build a new life, except those who give up.\" We even took a train to see the moon over the sea.","sz":"我们住在一家便宜的酒店。它看上去不错，却很奇怪：房间很脏，还有股煤气味。我很生气。第二天，我读到一篇关于一位曾坐过牢的名人的文章。如今他就在这家酒店工作！他为我们做了米饭，人非常热情，他穿着长裙的妻子还端来了茶。他在一次采访中说：“每个人都能开始新生活，除了那些放弃的人。”我们甚至坐火车去看了海上的月亮。","q":[["The _____ is bright tonight.","moon"],["_____ to meet you.","nice"],["I need to _____ for the exam.","prepare"],["He was sent to _____.","prison"],["We eat _____ every day.","rice"]],"block":6,"blockTheme":"生活场景","words":[{"r":661,"lesson":34,"w":"angry","b":"angry","ipa":"/ˈæŋɡri/","pos":"adj.","zh":"生气的","def":"feeling strong displeasure","ee":"Don't be angry with me.","ez":"别生我的气。","ph":[["angry with sb","生某人的气"],["angry about sth","因某事生气"]]},{"r":662,"lesson":34,"w":"article","b":"article","ipa":"/ˈɑːtɪkl/","pos":"n.","zh":"文章；物品；冠词","def":"a piece of writing in a newspaper; a thing","ee":"I read an interesting article.","ez":"我读了一篇有趣的文章。","ph":[["article of clothing","一件衣服"],["definite article","定冠词"]]},{"r":663,"lesson":34,"w":"build","b":"build","ipa":"/bɪld/","pos":"v.","zh":"建造","def":"to make something by putting parts together","ee":"They're building a new school.","ez":"他们在建一所新学校。","ph":[["build up","逐渐增强"],["Rome wasn't built in a day.","罗马不是一天建成的。"]]},{"r":664,"lesson":34,"w":"dirty","b":"dirty","ipa":"/ˈdɜːti/","pos":"adj.","zh":"脏的","def":"not clean","ee":"Your shoes are dirty.","ez":"你的鞋脏了。","ph":[["dirty work","苦差事"],["get your hands dirty","亲力亲为"]]},{"r":665,"lesson":34,"w":"except","b":"except","ipa":"/ɪkˈsept/","pos":"prep.","zh":"除了……之外","def":"not including","ee":"Everyone came except Tom.","ez":"除了汤姆，大家都来了。","ph":[["except for","除……以外"],["except that","只是"]]},{"r":666,"lesson":34,"w":"famous","b":"famous","ipa":"/ˈfeɪməs/","pos":"adj.","zh":"著名的","def":"known by many people","ee":"Paris is famous for the Eiffel Tower.","ez":"巴黎因埃菲尔铁塔而闻名。","ph":[["be famous for","因……而著名"],["world-famous","举世闻名的"]]},{"r":667,"lesson":34,"w":"gas","b":"gas","ipa":"/ɡæs/","pos":"n.","zh":"气体；煤气；汽油（美）","def":"a substance like air; fuel","ee":"Turn off the gas.","ez":"关掉煤气。","ph":[["gas station","加油站"],["step on the gas","加速"]]},{"r":668,"lesson":34,"w":"hotel","b":"hotel","ipa":"/həʊˈtel/","pos":"n.","zh":"酒店，旅馆","def":"a building where you pay to stay","ee":"We stayed in a nice hotel.","ez":"我们住在一家不错的酒店。","ph":[["check into a hotel","入住酒店"],["five-star hotel","五星级酒店"]]},{"r":669, ,"回避（问题）"]]},{"r":678,"lesson":34,"w":"strange","b":"strange","ipa":"/streɪndʒ/","pos":"adj.","zh":"奇怪的；陌生的","def":"unusual; unknown","ee":"That's strange.","ez":"真奇怪。","ph":[["stranger","陌生人"],["strange to say","说来奇怪"]]},{"r":679,"lesson":34,"w":"train","b":"train","ipa":"/treɪn/","pos":"n./v.","zh":"火车；训练","def":"a vehicle on rails; to practise","ee":"I go by train. He trains every day.","ez":"我坐火车去。他每天训练。","ph":[["train of thought","思路"],["training","培训"]]},{"r":680,"lesson":34,"w":"warm","b":"warm","ipa":"/wɔːm/","pos":"adj./v.","zh":"温暖的；热情的；使温暖","def":"slightly hot; friendly","ee":"It's warm today. They gave us a warm welcome.","ez":"今天很暖和。他们热情欢迎我们。","ph":[["warm up","热身；加热"],["warm-hearted","热心肠的"]]}]},{"n":35,"t":"A Tired Scientist","se":"My friend is a serious science student. One night, she was very tired and felt the pain of too much work. \"Let's spend some time outside,\" I said. We looked at a cloud and a bird. She gave me an account of her day, then told me a joke and laughed. \"That's my favourite message!\" she said. Our relationship is comfortable. Her room had a lot of dust, but no damage. Later she went back to paint in the hospital art club. Exercise gives pleasure. Nothing is wrong now.","sz":"我的朋友是个严谨的理科生。有一天晚上，她非常累，感到工作太多带来的痛苦。“我们去外面待一会儿吧。”我说。我们看着天上的云和鸟。她跟我讲了讲她这一天，然后讲了个笑话，自己先笑了。“这是我最喜欢的消息！”她说。我们的关系很融洽。她的房间里满是灰尘，但没有什么损坏。后来，她又回到医院的美术社团画画了。锻炼带来快乐。现在一切都好了。","q":[["Can I leave a _____?","message"],["Good _____!","night"],["It's a _____ to meet you.","pleasure"],["They have a good _____.","relationship"],["I love _____.","science"]],"block":6,"blockTheme":"生活场景","words":[{"r":681,"lesson":35,"w":"account","b":"account","ipa":"/əˈkaʊnt/","pos":"n.","zh":"账户；描述","def":"an arrangement with a bank; a report","ee":"I opened a bank account.","ez":"我开了一个银行账户。","ph":[["take into account","考虑到"],["on account of","由于"],["account for","解释；占"]]},{"r":682,"lesson":35,"w":"bird","b":"bird","ipa":"/bɜːd/","pos":"n.","zh":"鸟","def":"an animal with feathers and wings","ee":"A bird is singing in the tree.","ez":"一只鸟在树上唱歌。","ph":[["kill two birds with one stone","一石二鸟"],["Birds of a feather flock together.","物以类聚。"],["early bird","早起的人"]]},{"r":683,"lesson":35,"w":"cloud","b":"cloud","ipa":"/klaʊd/","pos":"n.","zh":"云","def":"white or grey mass in the sky","ee":"There isn't a cloud in the sky.","ez":"天空万里无云。","ph":[["on cloud nine","欣喜若狂"],["Every cloud has a silver lining.","黑暗中总有一线光明。"]]},{"r":684,"lesson":35,"w":"comfortable","b":"comfortable","ipa":"/ˈkʌmftəbl/","pos":"adj.","zh":"舒服的","def":"making you feel relaxed","ee":"This sofa is very comfortable.","ez":"这张沙发很舒服。","ph":[["make yourself comfortable","请随意"],["comfort zone","舒适区"]]},{"r":685,"lesson":35,"w":"damage","b":"damage","ipa":"/ˈdæmɪdʒ/","pos":"n./v.","zh":"损坏；损害","def":"harm; to cause harm","ee":"The storm caused a lot of damage.","ez":"暴风雨造成了很大的损失。","ph":[["do damage to","对……造成损害"],["brain damage","脑损伤"]]},{"r":686,"lesson":35,"w":"dust","b":"dust","ipa":"/dʌst/","pos":"n./v.","zh":"灰尘；擦去灰尘","def":"fine dry dirt","ee":"The table is covered with dust.","ez":"桌子上满是灰尘。","ph":[["bite the dust","失败；死去"],["when the dust settles","尘埃落定后"]]},{"r":687,"lesson":35,"w":"exercise","b":"exercise","ipa":"/ˈeksəsaɪz/","pos":"n./v.","zh":"锻炼；练习","def":"physical activity; a task for practice","ee":"Do some exercise every day.","ez":"每天做点运动。","ph":[["do exercise","锻炼"],["grammar exercises","语法练习"]]},{"r":688,"lesson":35,"w":"favourite","b":"favourite","ipa":"/ˈfeɪvərɪt/","pos":"adj./n.","zh":"最喜欢的","def":"liked more than others","ee":"What's your favourite food?","ez":"你最喜欢的食物是什么？","ph":[["美式拼写 favorite",""],["play favourites","偏心"]]},{"r":689,"lesson":35,"w":"hospital","b":"hospital","ipa":"/ˈhɒspɪtl/","pos":"n.","zh":"医院","def":"a place where ill people are treated","ee":"She is in hospital.","ez":"她在住院。","ph":[["go to hospital","去医院"],["hospital bed","病床"]]},{"r":690,"lesson":35,"w":"joke","b":"joke","ipa":"/dʒəʊk/","pos":"n./v.","zh":"笑话；开玩笑","def":"something said to make people laugh","ee":"Are you joking?","ez":"你在开玩笑吧？","ph":[["tell a joke","讲笑话"],["play a joke on","捉弄"],["No joke!","不是闹着玩的！"]]},{"r":691,"lesson":35,"w":"message","b":"message","ipa":"/ˈmesɪdʒ/","pos":"n.","zh":"消息；信息","def":"a written or spoken piece of information","ee":"Can I leave a message?","ez":"我可以留个言吗？","ph":[["get the message","明白"],["text message","短信"]]},{"r":692,"lesson":35,"w":"night","b":"night","ipa":"/naɪt/","pos":"n.","zh":"夜晚","def":"the time when it is dark","ee":"Good night!","ez":"晚安！","ph":[["at night","在夜里"],["all night","整夜"],["night owl","夜猫子"]]},{"r":693,"lesson":35,"w":"paint","b":"paint","ipa":"/peɪnt/","pos":"v./n.","zh":"油漆；绘画","def":"to put colour on; coloured liquid","ee":"She paints beautiful pictures.","ez":"她画漂亮的画。","ph":[["wet paint","油漆未干"],["paint the town red","狂欢"]]},{"r":694,"lesson":35,"w":"pleasure","b":"pleasure","ipa":"/ˈpleʒə(r)/","pos":"n.","zh":"愉快；乐事","def":"a feeling of happiness","ee":"It's a pleasure to meet you.","ez":"很荣幸见到您。","ph":[["My pleasure.","不客气，乐意效劳。"],["with pleasure","乐意"]]},{"r":695,"lesson":35,"w":"relationship","b":"relationship","ipa":"/rɪˈleɪʃnʃɪp/","pos":"n.","zh":"关系","def":"the way people are connected","ee":"They have a good relationship.","ez":"他们关系很好。","ph":[["in a relationship","恋爱中"],["relationship with","与……的关系"]]},{"r":696,"lesson":35,"w":"science","b":"science","ipa":"/ˈsaɪəns/","pos":"n.","zh":"科学","def":"knowledge about the natural world","ee":"I love science.","ez":"我热爱科学。","ph":[["science fiction","科幻小说"],["It's not rocket science.","这并不难。"]]},{"r":697,"lesson":35,"w":"serious","b":"serious","ipa":"/ˈsɪəriəs/","pos":"adj.","zh":"严肃的；严重的","def":"not joking; very bad","ee":"Are you serious? It's a serious problem.","ez":"你是认真的吗？这是个严重的问题。","ph":[["take sth seriously","认真对待"]]},{"r":698,"lesson":35,"w":"spend","b":"spend","ipa":"/spend/","pos":"v.","zh":"花费（钱/时间）","def":"to use money or time","ee":"I spend a lot of time reading.","ez":"我花很多时间读书。","ph":[["spend time doing","花时间做"],["spend money on","在……上花钱"]]},{"r":699,"lesson":35,"w":"tired","b":"tired","ipa":"/ˈtaɪəd/","pos":"adj.","zh":"累的；厌倦的","def":"needing rest; bored","ee":"I'm too tired to go out.","ez":"我太累了，不想出去。","ph":[["tired of","厌倦"],["sick and tired of","对……烦透了"]]},{"r":700,"lesson":35,"w":"wrong","b":"wrong","ipa":"/rɒŋ/","pos":"adj./adv.","zh":"错误的；有毛病的","def":"not correct; not working well","ee":"What's wrong?","ez":"怎么了？","ph":[["go wrong","出错"],["get sb wrong","误解某人"],["wrong number","打错电话"]]}]},{"n":36,"t":"A Walk in the Square","se":"On the left side of the university there is a big square. A crowd of students stands there. Step by step, I follow the smell of chocolate to a small shop. The temperature is low, so I buy a warm meal cooked in good oil; nothing can replace it. A brown dog with a pain in its leg sits near me. I probably spend a large amount of money, but it's a good deal. Society needs people who help each individual, so I take the dog to the bank of the river to rest. The engine of a car starts, and we leave together.","sz":"大学左边有一个大广场。一群学生站在那里。我一步一步循着巧克力的香味走到一家小店。气温很低，所以我买了一份用好油做的热饭，什么都替代不了它。一只腿受了伤的棕色小狗坐在我身边。我大概花了不少钱，但这很划算。社会需要关心每一个个体的人，于是我把狗带到河岸边休息。一辆车的发动机响了，我们一起离开了。","q":[["Enjoy your _____!","meal"],["Fry the eggs in a little _____.","oil"],["I have a _____ in my back.","pain"],["He will _____ be late.","probably"],["I need to _____ my phone.","replace"]],"block":7,"blockTheme":"社会与学习","words":[{"r":701,"lesson":36,"w":"amount","b":"amount","ipa":"/əˈmaʊnt/","pos":"n.","zh":"数量，数额","def":"how much of something there is","ee":"A large amount of money was stolen.","ez":"大量钱被偷了。","ph":[["a large amount of","大量的"],["amount to","总计；等于"]]},{"r":702,"lesson":36,"w":"bank","b":"bank","ipa":"/bæŋk/","pos":"n.","zh":"银行；河岸","def":"a place for keeping money; land beside a river","ee":"I need to go to the bank.","ez":"我需要去银行。","ph":[["break the bank","花很多钱"],["river bank","河岸"],["bank account","银行账户"]]},{"r":703,"lesson":36,"w":"brown","b":"brown","ipa":"/braʊn/","pos":" def":"food eaten at one time","ee":"Enjoy your meal!","ez":"请慢用！","ph":[["three meals a day","一日三餐"],["make a meal of","小题大做"]]},{"r":712,"lesson":36,"w":"oil","b":"oil","ipa":"/ɔɪl/","pos":"n.","zh":"油；石油","def":"thick liquid used for cooking or fuel","ee":"Fry the eggs in a little oil.","ez":"用少许油煎鸡蛋。","ph":[["olive oil","橄榄油"],["add oil to the fire","火上浇油"]]},{"r":713,"lesson":36,"w":"pain","b":"pain","ipa":"/peɪn/","pos":"n.","zh":"疼痛；痛苦","def":"the feeling when you are hurt","ee":"I have a pain in my back.","ez":"我背痛。","ph":[["No pain, no gain.","不劳无获。"],["a pain in the neck","讨厌的人或事"],["painkiller","止痛药"]]},{"r":714,"lesson":36,"w":"probably","b":"probably","ipa":"/ˈprɒbəbli/","pos":"adv.","zh":"很可能，大概","def":"almost certainly","ee":"He will probably be late.","ez":"他很可能会迟到。","ph":[["most probably","极有可能"]]},{"r":715,"lesson":36,"w":"replace","b":"replace","ipa":"/rɪˈpleɪs/","pos":"v.","zh":"代替；更换","def":"to take the place of; to put a new one instead","ee":"I need to replace my phone.","ez":"我需要换手机。","ph":[["replace A with B","用B替换A"],["irreplaceable","无可替代的"]]},{"r":716,"lesson":36,"w":"society","b":"society","ipa":"/səˈsaɪəti/","pos":"n.","zh":"社会；协会","def":"people living together; an organization","ee":"We live in a modern society.","ez":"我们生活在现代社会。","ph":[["high society","上流社会"]]},{"r":717,"lesson":36,"w":"square","b":"square","ipa":"/skweə(r)/","pos":"n./adj.","zh":"广场；正方形；平方","def":"an open area in a town; a shape with four equal sides","ee":"Let's meet in the main square.","ez":"我们在主广场见吧。","ph":[["square meter","平方米"],["back to square one","从头再来"],["fair and square","光明正大"]]},{"r":718,"lesson":36,"w":"step","b":"step","ipa":"/step/","pos":"n./v.","zh":"步；台阶；步骤","def":"one movement of your foot; a stage","ee":"Mind the step. Step by step.","ez":"注意台阶。一步一步来。","ph":[["step by step","逐步地"],["take steps","采取措施"],["watch your step","小心脚下"]]},{"r":719,"lesson":36,"w":"temperature","b":"temperature","ipa":"/ˈtemprətʃə(r)/","pos":"n.","zh":"温度；体温","def":"how hot or cold something is","ee":"The temperature dropped below zero.","ez":"气温降到了零度以下。","ph":[["take sb's temperature","量体温"],["have a temperature","发烧"]]},{"r":720,"lesson":36,"w":"university","b":"university","ipa":"/ˌjuːnɪˈvɜːsəti/","pos":"n.","zh":"大学","def":"a place for higher education","ee":"She goes to Peking University.","ez":"她在北京大学读书。","ph":[["go to university","上大学"],["university student","大学生"]]}]},{"n":37,"t":"The Proud Captain","se":"Our captain is proud and responsible. He wants to win the swimming race and demands a lot from us. \"Our enemy is our fear,\" he says. We swim at the sports centre on the top floor of a factory. One day I was hungry and wanted to take some food from the store. \"That is illegal,\" he said. \"Accept the law and advance.\" He bought me petrol for my car and a bag of bread. His successful team made our town happy. He has a nose for good people.","sz":"我们的队长自豪而有责任心。他想赢得游泳比赛，对我们要求很严。“我们的敌人是我们自己的恐惧。”他说。我们在一座工厂顶楼的体育中心游泳。有一天我饿了，想从商店里拿点吃的。“那是违法的，”他说，“遵守法律，向前走。”他为我的车加了油，还给了我一袋面包。他带领的成功队伍让我们镇上的人都很高兴。他很会识人。","q":[["Everyone must obey the _____.","law"],["My _____ is running.","nose"],["We need to get some _____.","petrol"],["I'm _____ of you.","proud"],["Who is _____ for this?","responsible"]],"block":7,"blockTheme":"社会与学习","words":[{"r":721,"lesson":37,"w":"accept","b":"accept","ipa":"/əkˈsept/","pos":"v.","zh":"接受；认可","def":"to take something offered; to agree","ee":"Please accept this gift.","ez":"请收下这份礼物。","ph":[["accept an offer","接受提议"],["accept the fact","接受事实"]]},{"r":722,"lesson":37,"w":"advance","b":"advance","ipa":"/ədˈvɑːns/","pos":"v./n.","zh":"前进；进步；预先","def":"to move forward; progress","ee":"Book in advance.","ez":"提前预订。","ph":[["in advance","提前"],["advanced","高级的"]]},{"r":723,"lesson":37,"w":"bag","b":"bag","ipa":"/bæɡ/","pos":"n.","zh":"包，袋子","def":"a container made of cloth, paper or plastic","ee":"Don't forget your bag.","ez":"别忘了你的包。","ph":[["bag of tricks","全套本领"],["in the bag","十拿九稳"],["let the cat out of the bag","泄露秘密"]]},{"r":724,"lesson":37,"w":"captain","b":"captain","ipa":"/ˈkæptɪn/","pos":"n.","zh":"船长；队长；机长","def":"the leader of a ship, plane or team","ee":"He is the captain of our football team.","ez":"他是我们足球队的队长。","ph":[["team captain","队长"]]},{"r":725,"lesson":37,"w":"centre","b":"centre","ipa":"/ˈsentə(r)/","pos":"n.","zh":"中心","def":"the middle; a building for an activity","ee":"We live in the city centre.","ez":"我们住在市中心。","ph":[["shopping centre","购物中心"],["centre of attention","关注焦点"],["美式拼写 center",""]]},{"r":726,"lesson":37,"w":"demand","b":"demand","ipa":"/dɪˈmɑːnd/","pos":"n./v.","zh":"要求；需求","def":"to ask strongly; the need for goods","ee":"There's a high demand for doctors.","ez":"对医生的需求很大。","ph":[["in demand","受欢迎的"],["on demand","按需"]]},{"r":727,"lesson":37,"w":"enemy","b":"enemy","ipa":"/ˈenəmi/","pos":"n.","zh":"敌人","def":"a person who hates you or fights against you","ee":"He has no enemies.","ez":"他没有敌人。","ph":[["make an enemy of","与……为敌"],["your own worst enemy","自己最大的敌人"]]},{"r":728,"lesson":37,"w":"factory","b":"factory","ipa":"/ˈfæktri/","pos":"n.","zh":"工厂","def":"a building where goods are made","ee":"My father works in a factory.","ez":"我父亲在工厂上班。","ph":[["factory worker","工人"],["factory settings","出厂设置"]]},{"r":729,"lesson":37,"w":"hungry","b":"hungry","ipa":"/ˈhʌŋɡri/","pos":"adj.","zh":"饥饿的；渴望的","def":"wanting food","ee":"I'm so hungry!","ez":"我好饿！","ph":[["hungry for","渴望"],["go hungry","挨饿"]]},{"r":730,"lesson":37,"w":"illegal","b":"illegal","ipa":"/ɪˈliːɡl/","pos":"adj.","zh":"违法的","def":"not allowed by law","ee":"It's illegal to drive without a licence.","ez":"无证驾驶是违法的。","ph":[["illegal parking","违章停车"]]},{"r":731,"lesson":37,"w":"law","b":"law","ipa":"/lɔː/","pos":"n.","zh":"法律","def":"rules made by a government","ee":"Everyone must obey the law.","ez":"人人都必须遵守法律。","ph":[["break the law","违法"],["law and order","法治"],["lay down the law","发号施令"]]},{"r":732,"lesson":37,"w":"nose","b":"nose","ipa":"/nəʊz/","pos":"n.","zh":"鼻子","def":"the part of the face you breathe and smell with","ee":"My nose is running.","ez":"我在流鼻涕。","ph":[["under your nose","就在眼皮底下"],["nosy","爱管闲事的"],["have a nose for","善于发现"]]},{"r":733,"lesson":37,"w":"petrol","b":"petrol","ipa":"/ˈpetrəl/","pos":"n.","zh":"汽油（英）","def":"fuel for cars (US: gas)","ee":"We need to get some petrol.","ez":"我们需要加点油。","ph":[["petrol station","加油站"]]},{"r":734,"lesson":37,"w":"proud","b":"proud","ipa":"/praʊd/","pos":"adj.","zh":"自豪的；骄傲的","def":"feeling pleased about something you did","ee":"I'm proud of you.","ez":"我为你骄傲。","ph":[["be proud of","为……自豪"],["do sb proud","给某人争光"]]},{"r":735,"lesson":37,"w":"responsible","b":"responsible","ipa":"/rɪˈspɒnsəbl/","pos":"adj.","zh":"负责的；有责任的","def":"having a duty to deal with something","ee":"Who is responsible for this?","ez":"这件事谁负责？","ph":[["be responsible for","对……负责"],["responsibility","责任"]]},{"r":736,"lesson":37,"w":"store","b":"store","ipa":"/stɔː(r)/","pos":"n./v.","zh":"商店；储存","def":"a shop; to keep for later use","ee":"Store the food in a cool place.","ez":"把食物存放在阴凉处。","ph":[["in store","即将发生"],["department store","百货商店"]]},{"r":737,"lesson":37,"w":"successful","b":"successful","ipa":"/səkˈsesfl/","pos":"adj.","zh":"成功的","def":"having achieved what you wanted","ee":"She is a successful businesswoman.","ez":"她是一名成功的女商人。","ph":[["be successful in","在……方面成功"]]},{"r":738,"lesson":37,"w":"swim","b":"swim","ipa":"/swɪm/","pos":"v.","zh":"游泳","def":"to move through water","ee":"Can you swim?","ez":"你会游泳吗？","ph":[["go swimming","去游泳"],["sink or swim","自生自灭"]]},{"r":739,"lesson":37,"w":"top","b":"top","ipa":"/tɒp/","pos":"n./adj.","zh":"顶部；最高的","def":"the highest part","ee":"The book is on the top shelf.","ez":"书在最上面的架子上。","ph":[["on top of","在……之上；除……之外"],["top of the class","班上第一"],["over the top","过分"]]},{"r":740,"lesson":37,"w":"win","b":"win","ipa":"/wɪn/","pos":"v.","zh":"赢；获得","def":"to be the best in a game; to get","ee":"We won the match!","ez":"我们赢了比赛！","ph":[["win-win","双赢"],["You can't win them all.","人不可能事事都赢。"]]}]},{"n":38,"t":"A Peaceful Coast","se":"Recently I borrowed a boat to explore the coast near a farm. There was a smoke from the fire in the farmer's house, but the air was peaceful. The map showed a silver shape on the water: a design of old stones. I wanted to practise my painting, so I tried to obtain the right expression of the sea. I washed my hands and touched the cold cream-colored sand. It was the best history lesson available. Luckily, I did not injure myself.","sz":"最近我借了一艘船，去探索农场附近的海岸。农夫家里的火冒出了一股烟，但空气很宁静。地图上显示水面上有一个银色的形状：那是古老石头组成的图案。我想练习画画，所以设法捕捉大海的正确神态。我洗了手，摸了摸冰凉的奶油色沙子。这是能找到的最好的一堂历史课。幸好我没有受伤。","q":[["Can you show me on the _____?","map"],["You need to _____ a visa.","obtain"],["The village is very _____.","peaceful"],["I _____ the piano every day.","practise"],["Have you seen him _____?","recently"]],"block":7,"blockTheme":"社会与学习","words":[{"r":741,"lesson":38,"w":"available","b":"available","ipa":"/əˈveɪləbl/","pos":"adj.","zh":"可获得的；有空的","def":"able to be used or bought; free","ee":"Is this room available? I'm available on Monday.","ez":"这个房间可以用吗？我周一有空。","ph":[["available for","可用于"],["readily available","很容易得到的"]]},{"r":742,"lesson":38,"w":"boat","b":"boat","ipa":"/bəʊt/","pos":"n.","zh":"小船","def":"a small vehicle for travelling on water","ee":"We took a boat across the lake.","ez":"我们乘船过了湖。","ph":[["in the same boat","处境相同"],["rock the boat","捣乱"],["miss the boat","错失良机"]]},{"r":743,"lesson":38,"w":"borrow","b":"borrow","ipa":"/ˈbɒrəʊ/","pos":"v.","zh":"借（入）","def":"to take something and return it later","ee":"Can I borrow your umbrella?","ez":"我能借你的伞吗？","ph":[["borrow from","向……借"],["注意 lend","借出"]]},{"r":744,"lesson":38,"w":"coast","b":"coast","ipa":"/kəʊst/","pos":"n.","zh":"海岸","def":"the land next to the sea","ee":"We drove along the coast.","ez":"我们沿着海岸开车。","ph":[["The coast is clear.","没人，可以行动了。"],["west coast","西海岸"]]},{"r":745,"lesson":38,"w":"cream","b":"cream","ipa":"/kriːm/","pos":"n./adj.","zh":"奶油；乳霜；奶油色的","def":"thick part of milk; a substance for the skin","ee":"Strawberries and cream.","ez":"奶油草莓。","ph":[["ice cream","冰淇淋"],["the cream of the crop","精英"]]},{"r":746,"lesson":38,"w":"design","b":"design","ipa":"/dɪˈzaɪn/","pos":"n./v.","zh":"设计","def":"a plan or drawing; to plan how something will look","ee":"She designs clothes.","ez":"她设计服装。","ph":[["by design","故意地"],["designer","设计师"]]},{"r":747,"lesson":38,"w":"expression","b":"expression","ipa":"/ɪkˈspreʃn/","pos":"n.","zh":"表情；表达；措辞","def":"a look on someone's face; a phrase","ee":"His expression was serious.","ez":"他的表情很严肃。","ph":[["facial expression","面部表情"],["freedom of expression","言论自由"]]},{"r":748,"lesson":38,"w":"farm","b":"farm","ipa":"/fɑːm/","pos":"n./v.","zh":"农场；耕种","def":"land for growing crops or keeping animals","ee":"They live on a farm.","ez":"他们住在农场。","ph":[["farmhouse","农舍"],["farmland","农田"]]},{"r":749,"lesson":38,"w":"history","b":"history","ipa":"/ˈhɪstri/","pos":"n.","zh":"历史","def":"the study of past events","ee":"I like history lessons.","ez":"我喜欢历史课。","ph":[["make history","创造历史"],["That's history.","那都是过去的事了。"]]},{"r":750,"lesson":38,"w":"injure","b":"injure","ipa":"/ˈɪndʒə(r)/","pos":"v.","zh":"伤害，使受伤","def":"to hurt","ee":"He injured his leg playing football.","ez":"他踢足球时伤了腿。","ph":[["injury","伤害"],["seriously injured","重伤"]]},{"r":751,"lesson":38,"w":"map","b":"map","ipa":"/mæp/","pos":"n.","zh":"地图","def":"a drawing of an area","ee":"Can you show me on the map?","ez":"你能在地图上指给我看吗？","ph":[["put sth on the map","使出名"],["road map","路线图"]]},{"r":752,"lesson":38,"w":"obtain","b":"obtain","ipa":"/əbˈteɪn/","pos":"v.","zh":"获得","def":"to get (formal)","ee":"You need to obtain a visa.","ez":"你需要办签证。","ph":[["obtain information","获取信息"]]},{"r":753,"lesson":38,"w":"peaceful","b":"peaceful","ipa":"/ˈpiːsfl/","pos":"adj.","zh":"和平的；平静的","def":"calm and quiet","ee":"The village is very peaceful.","ez":"这个村庄非常宁静。","ph":[["peaceful solution","和平解决方案"]]},{"r":754,"lesson":38,"w":"practise","b":"practise","ipa":"/ˈpræktɪs/","pos":"v.","zh":"练习；从事","def":"to do something regularly to improve","ee":"I practise the piano every day.","ez":"我每天练钢琴。","ph":[["美式拼写 practice",""],["practise what you preach","言行一致"]]},{"r":755,"lesson":38,"w":"recently","b":"recently","ipa":"/ˈriːsntli/","pos":"adv.","zh":"最近","def":"not long ago","ee":"Have you seen him recently?","ez":"你最近见过他吗？","ph":[["until recently","直到最近"]]},{"r":756,"lesson":38,"w":"shape","b":"shape","ipa":"/ʃeɪp/","pos":"n./v.","zh":"形状；状态；塑造","def":"the form of something","ee":"What shape is it?","ez":"它是什么形状？","ph":[["in shape","身体健康"],["out of shape","身材走样"],["take shape","成形"]]},{"r":757,"lesson":38,"w":"silver","b":"silver","ipa":"/ˈsɪlvə(r)/","pos":"n./adj.","zh":"银；银色的","def":"a shiny grey precious metal","ee":"She wore a silver ring.","ez":"她戴着一枚银戒指。","ph":[["silver lining","一线希望"],["born with a silver spoon","含着金汤匙出生"]]},{"r":758,"lesson":38,"w":"smoke","b":"smoke","ipa":"/sməʊk/","pos":"n./v.","zh":"烟；吸烟","def":"grey gas from fire; to use cigarettes","ee":"No smoking.","ez":"禁止吸烟。","ph":[["No smoke without fire.","无风不起浪。"],["go up in smoke","化为泡影"]]},{"r":759,"lesson":38,"w":"touch","b":"touch","ipa":"/tʌtʃ/","pos":"v./n.","zh":"触摸；感动；联系","def":"to put your hand on; contact","ee":"Don't touch it! Keep in touch.","ez":"别碰它！保持联系。","ph":[["keep in touch","保持联系"],["get in touch","取得联系"],["touching","感人的"]]},{"r":760,"lesson":38,"w":"wash","b":"wash","ipa":"/wɒʃ/","pos":"v./n.","zh":"洗","def":"to clean with water","ee":"Wash your hands before eating.","ez":"饭前洗手。","ph":[["wash up","洗碗"],["washing machine","洗衣机"]]}]},{"n":39,"t":"The Quiet College","se":"Usually I study at a quiet college. One subject is very difficult, but I never refuse a challenge. My friend from the club wants to marry soon. We walked on the path to the gate. \"Listen,\" she said, \"I want to be independent, not escape life.\" I gave her butter and vegetables from my garden — a sign of support. The supply of happiness depends on taste, not on a degree. Life is not an object; it has an advantage only when you share it. No one could attack her dream.","sz":"我通常在一所安静的学院学习。有一门科目很难，但我从不拒绝挑战。俱乐部的一个朋友打算很快结婚。我们沿着小路走到大门口。“听着，”她说，“我想独立，而不是逃避生活。”我送了她一些黄油和我菜园里的蔬菜，表示支持。幸福的来源取决于品味，而不是学位。生活不是一件物品，只有分享时才有价值。没有人能打击她的梦想。","q":[["Will you _____ me?","marry"],["What's that _____? I object to this plan.","object"],["Follow the _____ through the forest.","path"],["Please be _____.","quiet"],["My favourite _____ is history.","subject"]],"block":7,"blockTheme":"社会与学习","words":[{"r":761,"lesson":39,"w":"advantage","b":"advantage","ipa":"/ədˈvɑːntɪdʒ/","pos":"n.","zh":"优势；好处","def":"something that helps you","ee":"Speaking English is a big advantage.","ez":"会说英语是一大优势。","ph":[["take advantage of","利用"],["to your advantage","对你有利"]]},{"r":762,"lesson":39,"w":"attack","b":"attack","ipa":"/əˈtæk/","pos":"v./n.","zh":"攻击；（病）发作","def":"to try to hurt; a sudden illness","ee":"He had a heart attack.","ez":"他心脏病发作了。","ph":[["under attack","受到攻击"],["heart attack","心脏病发作"]]},{"r":763,"lesson":39,"w":"butter","b":"butter","ipa":"/ˈbʌtə(r)/","pos":"n.","zh":"黄油","def":"a yellow fat made from milk","ee":"Bread and butter, please.","ez":"请来点黄油面包。","ph":[["butterfly","蝴蝶"],["butter sb up","奉承某人"]]},{"r":764,"lesson":39,"w":"club","b":"club","ipa":"/klʌb/","pos":"n.","zh":"俱乐部；夜总会","def":"a group with a shared interest","ee":"I joined the chess club.","ez":"我加入了象棋俱乐部。","ph":[["Join the club!","同病相怜！"],["nightclub","夜店"]]},{"r":765,"lesson":39,"w":"college","b":"college","ipa":"/ˈkɒlɪdʒ/","pos":"n.","zh":"学院；大学","def":"a place for higher education","ee":"She goes to college in London.","ez":"她在伦敦上大学。","ph":[["go to college","上大学"],["college student","大学生"]]},{"r":766,"lesson":39,"w":"degree","b":"degree","ipa":"/dɪˈɡriː/","pos":"n.","zh":"学位；度数；程度","def":"a qualification from a university; a unit of temperature","ee":"It's 30 degrees today. She has a degree in law.","ez":"今天30度。她有法学学位。","ph":[["to some degree","在某种程度上"],["master's degree","硕士学位"]]},{"r":767,"lesson":39,"w":"escape","b":"escape","ipa":"/ɪˈskeɪp/","pos":"v./n.","zh":"逃脱","def":"to get away from","ee":"The bird escaped from its cage.","ez":"鸟从笼子里逃了出来。","ph":[["escape from","从……逃出"],["narrow escape","死里逃生"]]},{"r":768,"lesson":39,"w":"gate","b":"gate","ipa":"/ɡeɪt/","pos":"n.","zh":"大门；登机口","def":"a door in a wall or fence","ee":"Your flight leaves from Gate 5.","ez":"你的航班从5号登机口出发。","ph":[["gatekeeper","守门人"]]},{"r":769,"lesson":39,"w":"independent","b":"independent","ipa":"/ˌɪndɪˈpendənt/","pos":"adj.","zh":"独立的","def":"not needing others","ee":"She is very independent.","ez":"她非常独立。","ph":[["independent of","不依赖于"],["Independence Day","独立日"]]},{"r":770,"lesson":39,"w":"listen","b":"listen","ipa":"/ˈlɪsn/","pos":"v.","zh":"听","def":"to pay attention to sounds","ee":"Listen to me!","ez":"听我说！","ph":[["listen to","听"],["listen up","注意听"]]},{"r":771,"lesson":39,"w":"marry","b":"marry","ipa":"/ˈmæri/","pos":"v.","zh":"结婚，嫁，娶","def":"to become husband and wife","ee":"Will you marry me?","ez":"你愿意嫁给我吗？","ph":[["get married","结婚"],["be married to","与……结婚"]]},{"r":772,"lesson":39,"w":"object","b":"object","ipa":"/ˈɒbdʒɪkt/ n., /əbˈdʒekt/ v.","pos":"n./v.","zh":"物体；目标；反对","def":"a thing; an aim; to disagree","ee":"What's that object? I object to this plan.","ez":"那是什么东西？我反对这个计划。","ph":[["object to","反对"],["objective","目标；客观的"]]},{"r":773,"lesson":39,"w":"path","b":"path","ipa":"/pɑːθ/","pos":"n.","zh":"小路；道路","def":"a narrow way for walking","ee":"Follow the path through the forest.","ez":"沿着林间小路走。","ph":[["career path","职业道路"],["cross paths","相遇"]]},{"r":774,"lesson":39,"w":"quiet","b":"quiet","ipa":"/ˈkwaɪət/","pos":"adj.","zh":"安静的","def":"making little noise","ee":"Please be quiet.","ez":"请安静。","ph":[["keep quiet","保持安静；保密"],["peace and quiet","宁静"]]},{"r":775,"lesson":39,"w":"refuse","b":"refuse","ipa":"/rɪˈfjuːz/","pos":"v.","zh":"拒绝","def":"to say no","ee":"He refused to help me.","ez":"他拒绝帮我。","ph":[["refuse to do","拒绝做"],["an offer you can't refuse","无法拒绝的条件"]]},{"r":776,"lesson":39,"w":"subject (n)","b":"subject","ipa":"/ˈsʌbdʒɪkt/","pos":"n.","zh":"科目；主题；主语","def":"an area of study; a topic","ee":"My favourite subject is history.","ez":"我最喜欢的科目是历史。","ph":[["change the subject","换个话题"],["subject to","受……支配；视……而定"]]},{"r":777,"lesson":39,"w":"supply","b":"supply","ipa":"/səˈplaɪ/","pos":"n./v.","zh":"供应；提供","def":"an amount available; to provide","ee":"We need food supplies.","ez":"我们需要食物供给。","ph":[["supply and demand","供求"],["in short supply","短缺"]]},{"r":778,"lesson":39,"w":"taste","b":"taste","ipa":"/teɪst/","pos":"n./v.","zh":"味道；品味；尝","def":"flavour; style; to try food","ee":"This soup tastes good. She has good taste.","ez":"这汤很好喝。她很有品味。","ph":[["a taste of your own medicine","以其人之道还治其人之身"],["to taste","按口味"]]},{"r":779,"lesson":39,"w":"usually","b":"usually","ipa":"/ˈjuːʒuəli/","pos":"adv.","zh":"通常","def":"normally","ee":"I usually get up at seven.","ez":"我通常七点起床。","ph":[["as usual","照常"]]},{"r":780,"lesson":39,"w":"vegetable","b":"vegetable","ipa":"/ˈvedʒtəbl/","pos":"n.","zh":"蔬菜","def":"a plant eaten as food","ee":"Eat your vegetables!","ez":"把蔬菜吃了！","ph":[["vegetable garden","菜园"],["green vegetables","绿叶蔬菜"]]}]},{"n":40,"t":"A Trip to the Village","se":"Next week I will arrange a trip to my grandfather's village. He lives in a cottage below a hill, and he has a gentle voice. He used to repair machines and earn money at the front of a department store. He reads the newspaper with his hat on and plays an old instrument. A parcel for him is on the wall shelf by the door. He doesn't smoke a cigarette any more. He likes to serve tea and talk about religion. I carry the parcel on my shoulder.","sz":"下周我要安排一次去爷爷村子的旅行。他住在山下的一间小屋里，说话温声细语。他过去在一家百货商店门前修理机器赚钱。他戴着帽子看报纸，还会弹奏一件老乐器。门边墙架上放着一个给他的包裹。他已经不再抽烟了。他喜欢端茶，聊聊宗教。我把包裹扛在肩上。","q":[["The coffee _____ is broken.","machine"],["I read the _____ every morning.","newspaper"],["I got a _____ today.","parcel"],["Can you _____ my bike?","repair"],["Have a good _____!","trip"]],"block":7,"blockTheme":"社会与学习","words":[{"r":781,"lesson":40,"w":"arrange","b":"arrange","ipa":"/əˈreɪndʒ/","pos":"v.","zh":"安排；整理","def":"to plan; to put in order","ee":"I'll arrange a meeting for you.","ez":"我会给你安排一次会面。","ph":[["arrange for","为……做安排"],["arrangement","安排"]]},{"r":782,"lesson":40,"w":"below","b":"below","ipa":"/bɪˈləʊ/","pos":"prep./adv.","zh":"在……下面；低于","def":"at a lower level than","ee":"The temperature is below zero.","ez":"气温在零度以下。","ph":[["see below","见下文"],["below average","低于平均水平"]]},{"r":783,"lesson":40,"w":"cigarette","b":"cigarette","ipa":"/ˌsɪɡəˈret/","pos":"n.","zh":"香烟","def":"tobacco rolled in paper","ee":"He smokes ten cigarettes a day.","ez":"他每天抽十支烟。","ph":[["light a cigarette","点烟"]]},{"r":784,"lesson":40,"w":"cottage","b":"cottage","ipa":"/ˈkɒtɪdʒ/","pos":"n.","zh":"村舍，小屋","def":"a small house in the country","ee":"They have a cottage by the sea.","ez":"他们在海边有一座小屋。","ph":[["cottage cheese","农家奶酪"]]},{"r":785,"lesson":40,"w":"department","b":"department","ipa":"/dɪˈpɑːtmənt/","pos":"n.","zh":"部门；系","def":"a section of an organization","ee":"She works in the sales department.","ez":"她在销售部工作。","ph":[["department store","百货商店"],["HR department","人力资源部"]]},{"r":786,"lesson":40,"w":"earn","b":"earn","ipa":"/ɜːn/","pos":"v.","zh":"挣得；赢得","def":"to get money for work; to deserve","ee":"How much do you earn?","ez":"你挣多少钱？","ph":[["earn a living","谋生"],["earn respect","赢得尊重"]]},{"r":787,"lesson":40,"w":"front","b":"front","ipa":"/frʌnt/","pos":"n./adj.","zh":"前面；前部的","def":"the part that faces forward","ee":"Let's sit in the front row.","ez":"我们坐前排吧。","ph":[["in front of","在……前面"],["front door","前门"]]},{"r":788,"lesson":40,"w":"gentle","b":"gentle","ipa":"/ˈdʒentl/","pos":"adj.","zh":"温和的；轻柔的","def":"kind and calm; not strong","ee":"Be gentle with the baby.","ez":"对宝宝要温柔。","ph":[["gently","轻轻地"],["gentle breeze","微风"]]},{"r":789,"lesson":40,"w":"hat","b":"hat","ipa":"/hæt/","pos":"n.","zh":"帽子","def":"a covering for the head","ee ":"出生的；（bear 的过去分词）","def":"having started life","ee":"I was born in 1995.","ez":"我出生于1995年。","ph":[["be born in","出生于"],["born and raised","土生土长"],["born to do","天生做……的"]]},{"r":803,"lesson":41,"w":"clothes","b":"clothes","ipa":"/kləʊðz/","pos":"n.","zh":"衣服","def":"things you wear","ee":"Put on your clothes.","ez":"穿上衣服。","ph":[["change clothes","换衣服"],["Clothes make the man.","人靠衣装。"]]},{"r":804,"lesson":41,"w":"correct","b":"correct","ipa":"/kəˈrekt/","pos":"adj./v.","zh":"正确的；纠正","def":"right; to make right","ee":"That's correct. Please correct my mistakes.","ez":"对的。请纠正我的错误。","ph":[["politically correct","政治正确的"],["correct me if I'm wrong","如果我说错了请指正"]]},{"r":805,"lesson":41,"w":"double","b":"double","ipa":"/ˈdʌbl/","pos":"adj./v.","zh":"双倍的；加倍","def":"twice as much; to make twice as big","ee":"I'd like a double room.","ez":"我想要一间双人房。","ph":[["double check","复核"],["double-edged sword","双刃剑"],["see double","重影"]]},{"r":806,"lesson":41,"w":"English","b":"english","ipa":"/ˈɪŋɡlɪʃ/","pos":"n./adj.","zh":"英语；英国的","def":"the language of England, the USA, etc.","ee":"I'm learning English.","ez":"我在学英语。","ph":[["in plain English","简单地说"],["English breakfast","英式早餐"]]},{"r":807,"lesson":41,"w":"forget","b":"forget","ipa":"/fəˈɡet/","pos":"v.","zh":"忘记","def":"to not remember","ee":"Don't forget to call me.","ez":"别忘了给我打电话。","ph":[["forget it","算了"],["forget to do","忘记去做"],["forgive and forget","不计前嫌"]]},{"r":808,"lesson":41,"w":"goal","b":"goal","ipa":"/ɡəʊl/","pos":"n.","zh":"目标；进球","def":"an aim; a point in football","ee":"My goal is to run a marathon.","ez":"我的目标是跑马拉松。","ph":[["score a goal","进球"],["set a goal","设定目标"]]},{"r":809,"lesson":41,"w":"hate","b":"hate","ipa":"/heɪt/","pos":"v./n.","zh":"讨厌，恨","def":"to dislike very much","ee":"I hate waiting.","ez":"我讨厌等待。","ph":[["love-hate relationship","爱恨交织的关系"],["I hate to say it, but...","我不想这么说，但……"]]},{"r":810,"lesson":41,"w":"kill","b":"kill","ipa":"/kɪl/","pos":"v.","zh":"杀死；消磨","def":"to make someone die; to pass time","ee":"We played cards to kill time.","ez":"我们打牌消磨时间。","ph":[["kill time","消磨时间"],["My feet are killing me.","我脚疼死了。"]]},{"r":811,"lesson":41,"w":"last","b":"last","ipa":"/lɑːst/","pos":"adj./v.","zh":"最后的；上一个；持续","def":"final; the one before; to continue","ee":"Last night I saw a film. The meeting lasted two hours.","ez":"昨晚我看了部电影。会议持续了两小时。","ph":[["at last","终于"],["last but not least","最后但同样重要"],["last-minute","最后一刻的"]]},{"r":812,"lesson":41,"w":"main","b":"main","ipa":"/meɪn/","pos":"adj.","zh":"主要的","def":"most important","ee":"What's the main problem?","ez":"主要问题是什么？","ph":[["main course","主菜"],["main road","大路"],["mainly","主要地"]]},{"r":813,"lesson":41,"w":"pair","b":"pair","ipa":"/peə(r)/","pos":"n.","zh":"一双，一对","def":"two things of the same kind","ee":"I need a new pair of shoes.","ez":"我需要一双新鞋。","ph":[["in pairs","成对地"],["a pair of glasses","一副眼镜"]]},{"r":814,"lesson":41,"w":"promise","b":"promise","ipa":"/ˈprɒmɪs/","pos":"v./n.","zh":"承诺","def":"to say you will certainly do something","ee":"I promise I'll be there.","ez":"我保证会到。","ph":[["keep a promise","信守承诺"],["break a promise","违背承诺"]]},{"r":815,"lesson":41,"w":"regular","b":"regular","ipa":"/ˈreɡjələ(r)/","pos":"adj.","zh":"规律的；常规的；普通的","def":"happening at the same time; normal","ee":"Regular exercise is good for you.","ez":"规律锻炼对你有好处。","ph":[["regular customer","常客"],["on a regular basis","定期地"]]},{"r":816,"lesson":41,"w":"somewhere","b":"somewhere","ipa":"/ˈsʌmweə(r)/","pos":"adv.","zh":"在某处","def":"in or to a place that is not known","ee":"I left my keys somewhere.","ez":"我把钥匙落在某处了。","ph":[["somewhere else","别的地方"],["get somewhere","取得进展"]]},{"r":817,"lesson":41,"w":"space","b":"space","ipa":"/speɪs/","pos":"n.","zh":"空间；太空","def":"an empty area; the universe beyond the earth","ee":"There's no space for my bag.","ez":"没地方放我的包了。","ph":[["outer space","外太空"],["give sb space","给某人空间"],["parking space","停车位"]]},{"r":818,"lesson":41,"w":"these","b":"these","ipa":"/ðiːz/","pos":"det./pron.","zh":"这些","def":"plural of this","ee":"These apples are sweet.","ez":"这些苹果很甜。","ph":[["these days","如今"]]},{"r":819,"lesson":41,"w":"useful","b":"useful","ipa":"/ˈjuːsfl/","pos":"adj.","zh":"有用的","def":"helpful","ee":"This app is very useful.","ez":"这个应用很有用。","ph":[["come in useful","派上用场"],["make yourself useful","帮帮忙"]]},{"r":820,"lesson":41,"w":"without","b":"without","ipa":"/wɪˈðaʊt/","pos":"prep.","zh":"没有，无","def":"not having","ee":"I can't live without music.","ez":"我不能没有音乐。","ph":[["without doubt","毫无疑问"],["go without","没有……也行"],["without fail","必定"]]}]},{"n":42,"t":"A Wonderful Year","se":"This year my husband and I had a wonderful time. We went abroad as passengers on a ship to a foreign country. My guess is that we will go again. It is hard to express how calm we felt. I copied a recipe for a fish dish and drank a local beer. I saw a sign at an animal park: \"Support the rules: don't feed those lions!\" In my opinion, they were wonderful. People say I tell lies, but this story is mine: I really did press a lion's nose. Okay, I'm joking.","sz":"今年我和丈夫度过了一段美好的时光。我们作为乘客坐船去了一个外国。我猜我们还会再去。很难表达我们当时有多平静。我抄了一份鱼菜的食谱，还喝了当地啤酒。我在一个动物园看到一块牌子：“请遵守规定，别喂那些狮子！”在我看来，它们真是太棒了。人们说我撒谎，不过这个故事是我的：我真的按了狮子的鼻子。好吧，我开玩笑的。","q":[["This book is _____.","mine"],["What's your _____?","opinion"],["_____ the button.","press"],["Please _____ here. Look at that sign.","sign"],["Thank you for your _____.","support"]],"block":8,"blockTheme":"情感与人际","words":[{"r":821,"lesson":42,"w":"animal","b":"animal","ipa":"/ˈænɪml/","pos":"n.","zh":"动物","def":"a living creature that is not a plant","ee":"Dogs are my favourite animals.","ez":"狗是我最喜欢的动物。","ph":[["wild animal","野生动物"],["party animal","爱玩的人"]]},{"r":822,"lesson":42,"w":"beer","b":"beer","ipa":"/bɪə(r)/","pos":"n.","zh":"啤酒","def":"an alcoholic drink made from grain","ee":"A glass of beer, please.","ez":"请来一杯啤酒。","ph":[["draft beer","生啤"]]},{"r":823,"lesson":42,"w":"calm","b":"calm","ipa":"/kɑːm/","pos":"adj./v.","zh":"平静的；使平静","def":"peaceful; not excited","ee":"Stay calm. Calm down!","ez":"保持冷静。冷静点！","ph":[["calm down","冷静下来"],["the calm before the storm","暴风雨前的宁静"]]},{"r":824,"lesson":42,"w":"copy","b":"copy","ipa":"/ˈkɒpi/","pos":"n./v.","zh":"副本；一本；复制","def":"a thing made the same as another; to make the same","ee":"Can I have a copy?","ez":"能给我一份副本吗？","ph":[["copy and paste","复制粘贴"],["hard copy","纸质版"]]},{"r":825,"lesson":42,"w":"dish","b":"dish","ipa":"/dɪʃ/","pos":"n.","zh":"盘子；一道菜","def":"a plate; food prepared in a particular way","ee":"This is my favourite dish.","ez":"这是我最喜欢的菜。","ph":[["do the dishes","洗碗"],["side dish","配菜"]]},{"r":826,"lesson":42,"w":"express","b":"express","ipa":"/ɪkˈspres/","pos":"v./adj.","zh":"表达；快速的","def":"to show a feeling; fast","ee":"It's hard to express my feelings.","ez":"很难表达我的感受。","ph":[["express train","快车"],["express yourself","表达自己"],["express delivery","快递"]]},{"r":827,"lesson":42,"w":"foreign","b":"foreign","ipa":"/ˈfɒrən/","pos":"adj.","zh":"外国的","def":"from another country","ee":"Do you speak any foreign languages?","ez":"你会说外语吗？","ph":[["foreign language","外语"],["foreigner","外国人"]]},{"r":828,"lesson":42,"w":"guess","b":"guess","ipa":"/ɡes/","pos":"v./n.","zh":"猜","def":"to give an answer without being sure","ee":"Guess who I saw today!","ez":"猜猜我今天看见谁了！","ph":[["I guess","我想"],["Your guess is as good as mine.","我也不知道。"]]},{"r":829,"lesson":42,"w":"husband","b":"husband","ipa":"/ˈhʌzbənd/","pos":"n.","zh":"丈夫","def":"the man a woman is married to","ee":"Her husband is a doctor.","ez":"她丈夫是医生。","ph":[["husband and wife","夫妻"]]},{"r":830,"lesson":42,"w":"lie","b":"lie","ipa":"/laɪ/","pos":"v./n.","zh":"躺；说谎；谎言","def":"to be flat; to say something untrue","ee":"Don't lie to me. Lie down.","ez":"别对我说谎。躺下。","ph":[["tell a lie","说谎"],["white lie","善意的谎言"],["lie in","睡懒觉"]]},{"r":831,"lesson":42,"w":"mine","b":"mine","ipa":"/maɪn/","pos":"pron./n.","zh":"我的；矿","def":"the one belonging to me; a place where coal is dug","ee":"This book is mine.","ez":"这本书是我的。","ph":[["a friend of mine","我的一个朋友"],["gold mine","金矿；宝库"]]},{"r":832,"lesson":42,"w":"opinion","b":"opinion","ipa":"/əˈpɪnjən/","pos":"n.","zh":"意见，看法","def":"what you think about something","ee":"What's your opinion?","ez":"你的看法是什么？","ph":[["in my opinion","在我看来"],["public opinion","舆论"]]},{"r":833,"lesson":42,"w":"passenger","b":"passenger","ipa":"/ˈpæsɪndʒə(r)/","pos":"n.","zh":"乘客","def":"a person travelling in a vehicle","ee":"All passengers please board now.","ez":"请所有乘客现在登机。","ph":[["passenger seat","副驾驶座"]]},{"r":834,"lesson":42,"w":"press","b":"press","ipa":"/pres/","pos":"v./n.","zh":"按，压；新闻界","def":"to push; newspapers and journalists","ee":"Press the button.","ez":"按下按钮。","ph":[["the press","新闻界"],["press conference","新闻发布会"],["be pressed for time","时间紧迫"]]},{"r":835,"lesson":42,"w":"rule","b":"rule","ipa":"/ruːl/","pos":"n./v.","zh":"规则；统治","def":"what you must or must not do","ee":"Follow the rules.","ez":"遵守规则。","ph":[["as a rule","通常"],["rule of thumb","经验法则"],["rule out","排除"]]},{"r":836,"lesson":42,"w":"sign","b":"sign","ipa":"/saɪn/","pos":"n./v.","zh":"标志；迹象；签名","def":"a notice; a mark; to write your name","ee":"Please sign here. Look at that sign.","ez":"请在这里签名。看那个标志。","ph":[["sign up","报名"],["a good sign","好兆头"],["sign language","手语"]]},{"r":837,"lesson":42,"w":"support","b":"support","ipa":"/səˈpɔːt/","pos":"v./n.","zh":"支持；支撑","def":"to help; to hold up","ee":"Thank you for your support.","ez":"感谢你的支持。","ph":[["support a team","支持一支球队"],["technical support","技术支持"]]},{"r":838,"lesson":42,"w":"those","b":"those","ipa":"/ðəʊz/","pos":"det./pron.","zh":"那些","def":"plural of that","ee":"Those shoes are nice.","ez":"那些鞋很好看。","ph":[["those who","那些……的人"],["in those days","在那时"]]},{"r":839,"lesson":42,"w":"wonderful","b":"wonderful","ipa":"/ˈwʌndəfl/","pos":"adj.","zh":"极好的","def":"very good","ee":"We had a wonderful holiday.","ez":"我们度过了一个美好的假期。","ph":[["It's a wonderful life.","生活多美好。"]]},{"r":840,"lesson":42,"w":"year","b":"year","ipa":"/jɪə(r)/","pos":"n.","zh":"年","def":"twelve months","ee":"Happy New Year!","ez":"新年快乐！","ph":[["all year round","一年到头"],["years old","……岁"],["year after year","年复一年"]]}]},{"n":43,"t":"A Funny Guest","se":"A young guest came to our lake house with a horse. He was afraid of nothing. \"Trust me,\" he said, \"I will discover a new way to make a profit.\" He wanted to share his plan with plenty of people: to count the fish in the lake! We all laughed — it was funny. But it is necessary to have modern ideas. One night, someone tried to steal his horse. He drew a circle on the board to explain. He wished to reduce the risk of death for the fish. Interesting, right?","sz":"一位年轻客人骑着马来到我们的湖边小屋。他什么都不怕。“相信我，”他说，“我会发现一种新的赚钱方法。”他想和许多人分享他的计划：数湖里的鱼！我们都笑了，这太好笑了。但拥有新潮的想法是必要的。有一天晚上，有人想偷他的马。他在板上画了一个圆圈来解释。他希望降低鱼的死亡风险。有意思吧？","q":[["I like _____ art.","modern"],["Is it _____ to book?","necessary"],["We have _____ of time.","plenty"],["The company made a _____.","profit"],["_____ your speed.","reduce"]],"block":8,"blockTheme":"情感与人际","words":[{"r":841,"lesson":43,"w":"afraid","b":"afraid","ipa":"/əˈfreɪd/","pos":"adj.","zh":"害怕的；恐怕","def":"feeling fear; sorry to say","ee":"I'm afraid of dogs. I'm afraid I can't come.","ez":"我怕狗。恐怕我来不了。","ph":[["be afraid of","害怕"],["I'm afraid so/not.","恐怕是/不是。"]]},{"r":842,"lesson":43,"w":"board","b":"board","ipa":"/bɔːd/","pos":"n./v.","zh":"木板；董事会；登上（交通工具）","def":"a flat piece of wood; to get on","ee":"Write on the board. Please board the plane.","ez":"在黑板上写。请登机。","ph":[["on board","在船/机上"],["across the board","全面地"],["boarding pass","登机牌"]]},{"r":843,"lesson":43,"w":"circle","b":"circle","ipa":"/ˈsɜːkl/","pos":"n./v.","zh":"圆圈；圈子；环绕","def":"a round shape","ee":"Draw a circle.","ez":"画一个圆。","ph":[["go around in circles","原地打转"],["circle of friends","朋友圈"],["full circle","绕了一圈回到原点"]]},{"r":844,"lesson":43,"w":"count","b":"count","ipa":"/kaʊnt/","pos":"v.","zh":"数；重要；依靠","def":"to say numbers in order; to matter","ee":"Count from one to ten. Every minute counts.","ez":"从一数到十。每一分钟都很重要。","ph":[["count on","依靠"],["count me in","算我一个"],["Don't count your chickens before they hatch.","别高兴得太早。"]]},{"r":845,"lesson":43,"w":"death","b":"death","ipa":"/deθ/","pos":"n.","zh":"死亡","def":"the end of life","ee":"His death was a shock.","ez":"他的去世令人震惊。","ph":[["bored to death","无聊死了"],["life and death","生死攸关"]]},{"r":846,"lesson":43,"w":"discover","b":"discover","ipa":"/dɪˈskʌvə(r)/","pos":"v.","zh":"发现","def":"to find something for the first time","ee":"Columbus discovered America.","ez":"哥伦布发现了美洲。","ph":[["discovery","发现"],["discover that","发现……"]]},{"r":847,"lesson":43,"w":"funny","b":"funny","ipa":"/ˈfʌni/","pos":"adj.","zh":"好笑的；奇怪的","def":"making you laugh; strange","ee":"That's a funny story.","ez":"那是个好笑的故事。","ph":[["funny feeling","奇怪的感觉"],["Very funny!","（讽刺）真好笑！"]]},{"r":848,"lesson":43,"w":"guest","b":"guest","ipa":"/ɡest/","pos":"n.","zh":"客人","def":"a person invited to visit","ee":"We have guests tonight.","ez":"我们今晚有客人。","ph":[["Be my guest.","请便。"],["guest room","客房"]]},{"r":849,"lesson":43,"w":"horse","b":"horse","ipa":"/hɔːs/","pos":"n.","zh":"马","def":"a large animal you can ride","ee":"Can you ride a horse?","ez":"你会骑马吗？","ph":[["hold your horses","别急"],["straight from the horse's mouth","消息可靠"],["dark horse","黑马"]]},{"r":850,"lesson":43,"w":"lake","b":"lake","ipa":"/leɪk/","pos":"n.","zh":"湖","def":"a large area of water surrounded by land","ee":"We swam in the lake.","ez":"我们在湖里游泳。","ph":[["West Lake","西湖"]]},{"r":851,"lesson":43,"w":"modern","b":"modern","ipa":"/ˈmɒdn/","pos":"adj.","zh":"现代的","def":"of the present time","ee":"I like modern art.","ez":"我喜欢现代艺术。","ph":[["modern life","现代生活"],["modern times","现代"]]},{"r":852,"lesson":43,"w":"necessary","b":"necessary","ipa":"/ˈnesəsəri/","pos":"adj.","zh":"必要的","def":"needed","ee":"Is it necessary to book?","ez":"有必要预订吗？","ph":[["if necessary","如有必要"],["necessary evil","不得不忍受的坏事"]]},{"r":853,"lesson":43,"w":"plenty","b":"plenty","ipa":"/ˈplenti/","pos":"pron.","zh":"大量，充足","de     };
  } catch (e) {
    return base;
  }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
const knownSet = () => new Set(state.known);
function isKnown(rank) { return knownSet().has(rank); }
function toggleKnown(rank) {
  let list = state.known;
  if (list.includes(rank)) list = list.filter((r) => r !== rank);
  else list = list.concat([rank]);
  state.known = list;
  save();
  refreshCounters();
}
function lessonDone(n) { return !!state.done[n]; }
function toggleDone(n) {
  const words = byLesson[n].words;
  const all = words.every((w) => isKnown(w.r));
  if (all && lessonDone(n)) {
    delete state.done[n];
    words.forEach((w) => toggleKnownQuiet(w.r, false));
  } else {
    words.forEach((w) => toggleKnownQuiet(w.r, true));
    state.done[n] = new Date().toISOString().slice(0, 10);
  }
  save();
  render();
}
function toggleKnownQuiet(rank, value) {
  const has = state.known.includes(rank);
  if (value && !has) state.known.push(rank);
  if (!value && has) state.known = state.known.filter((r) => r !== rank);
}
function lessonProgress(n) {
  const words = byLesson[n].words;
  return words.filter((w) => isKnown(w.r)).length;
}
function dayProgress(d) {
  const [a, b] = lessonRange(d);
  let done = 0, total = 0;
  for (let n = a; n <= b; n++) { done += lessonProgress(n); total += byLesson[n].words.length; }
  return { done, total };
}
function dayCompleted(d) {
  const [a, b] = lessonRange(d);
  for (let n = a; n <= b; n++) if (!lessonDone(n)) return false;
  return true;
}
const INTERVALS = [2, 4, 7, 15, 30];
function nextLesson() {
  for (const l of BOOK.lessons) if (lessonProgress(l.n) < 20 || !lessonDone(l.n)) return l.n;
  return 50;
}
function dueReviews() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const out = [];
  Object.keys(state.done).forEach((n) => {
    const base = new Date(state.done[n] + "T00:00:00");
    if (isNaN(base)) return;
    const step = INTERVALS.findIndex((d) => {
      const due = new Date(base); due.setDate(due.getDate() + d); return due <= today;
    });
    if (step >= 0) out.push(Number(n));
  });
  return out.sort((a, b) => a - b);
}
function refreshCounters() {
  const known = new Set(state.known).size;
  const done = Object.keys(state.done).length;
  $("#knownCount").textContent = `已掌握 ${known} / 1000`;
  $("#doneCount").textContent = `已完成 ${done} / 50 课`;
  const pct = Math.round((known / 1000) * 100);
  $("#ring").style.setProperty("--p", pct);
  $("#ringNum").textContent = pct + "%";
  renderNav();
}

  voices = list;

function speak(text, rate) {

/* Story highlighting ------------------------------------------ */
function storyForms(word) {
  const w = word.toLowerCase();
  const forms = new Set([w]);
  if (/(s|x|z|ch|sh)$/.test(w)) forms.add(w + "es");
  else if (/[^aeiou]y$/.test(w)) forms.add(w.slice(0, -1) + "ies");
  else forms.add(w + "s");
  forms.add(w + "ing");
  if (w.endsWith("e")) forms.add(w.slice(0, -1) + "ing");
  forms.add(w + "ed");
  if (w.endsWith("e")) forms.add(w + "d");
  if (/[^aeiou]y$/.test(w)) forms.add(w.slice(0, -1) + "ied");
  if (/^[a-z]{3}$/.test(w)) forms.add(w + w.slice(-1) + "ing");
  return Array.from(forms).sort((a, b) => b.length - a.length);
}
function renderStory(lesson) {
  const map = {};
  lesson.words.forEach((w) => storyForms(w.b).forEach((f) => { if (!map[f]) map[f] = w.b; }));
  const used = {};
  const html = esc(lesson.se).replace(/[A-Za-z][A-Za-z'’]*/g, (token) => {
    const key = token.toLowerCase().replace(/['’]s$/, "");
    const base = map[token.toLowerCase()] || map[key];
    if (base && !used[base]) {
      used[base] = 1;
      const w = lesson.words.find((x) => x.b === base);
      return `<em data-act="jump" data-rank="${w.r}" title="${esc(w.zh)} · 点击查看卡片">${token}</em>`;
    }
    return token;
  });
  return html;
}

      <span class="ask">${esc(parts[0])}<input type="text" data-act="answer" aria-label="第 ${i + 1} 题填空">${esc(parts[1] || "")}</span>
      <span class="verdict"></span>
    </div>`;
  }).join("");
  const story = renderStory(lesson);
  return `
  <div class="topbar">
    <span class="crumb"><a class="link" href="#/plan">速通手册</a> / <a class="link" href="#/d/${day.n}">${esc(day.label)} ${esc(day.theme)}</a> / Lesson ${n}</span>
  </div>
  <div class="chapter-head theme-${day.n}">
    <div class="mono" style="font-size:12px;color:var(--ink-3)">Lesson ${n} · ${esc(lesson.blockTheme)} · 排名 ${lesson.words[0].r}–${lesson.words[19].r} · 第 ${day.n} 天</div>
    <h1>${esc(lesson.t)}</h1>
    <div class="toolbar">
      <button class="btn ghost" data-act="flash" data-scope="l" data-n="${n}">▤ 本课闪卡</button>
      <button class="btn ghost" data-act="speak" data-text="${esc(lesson.t)}">🔊 朗读标题</button>
      <button class="btn seal" data-act="done" data-n="${n}">${lessonDone(n) ? "↺ 取消完成标记" : "✓ 完成本课"}</button>
      <span class="pill ${prog === 20 ? "teal" : ""}">${prog} / 20 词已掌握</span>
      <a class="chip-btn" href="#/l/${n > 1 ? n - 1 : 1}">← 上一课</a>
      <a class="chip-btn" href="#/l/${n < 50 ? n + 1 : 50}">下一课 →</a>
    </div>
  </div>

  <h2 id="overview">速览</h2>
  <p class="hint">先看表回忆，再往下看卡片。点单词可以跳到对应卡片，点喇叭可以听发音。</p>
  <div class="table-wrap"><table>
    <thead><tr><th style="width:56px">排名</th><th>单词</th><th>音标</th><th>词性</th><th>中文释义</th><th>读</th><th>掌握</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>

  <h2 id="cards">单词卡片</h2>
  <div class="grid cols-3">${lesson.words.map((w, i) => wordCard(lesson, w, i)).join("")}</div>

  <h2 id="story">小片段</h2>
  <p class="hint">高亮的是本课单词，悬停看中文，点一下跳到它的卡片。</p>
  <div class="toolbar">
    <button class="btn ghost" data-act="speak" data-text="${esc(lesson.se)}" data-rate="0.86">🔊 朗读片段</button>
    <button class="btn ghost" data-act="toggle-zh" data-target="storyZh">显示／隐藏译文</button>
  </div>
  <div class="story">${story}
    <div class="zh" id="storyZh" hidden>${esc(lesson.sz)}</div>
  </div>

  <h2 id="quiz">自测</h2>
  <p class="hint">A 看清中文写英文，B 用本课单词填空，写完点“检查答案”。</p>
  <div class="quiz">${quizA}${quizB}</div>
  <div class="toolbar">
    <button class="btn" data-act="check" data-n="${n}">检查答案</button>
    <button class="btn ghost" data-act="answers" data-n="${n}">显示答案</button>
    <span class="meta" id="quizScore"></span>
  </div>
  <div class="notes">
    <label for="note-${n}">本课笔记（自动保存在本机）</label>
    <textarea id="note-${n}" data-act="note" data-n="${n}" placeholder="写下容易混的词、造句、想记住的搭配…">${esc(state.notes["L" + n] || "")}</textarea>
  </div>

  <div class="pager">
    ${n > 1 ? `<a href="#/l/${n - 1}">← Lesson ${n - 1} · ${esc(byLesson[n - 1].t)}</a>` : `<a href="#/plan">← 学习计划</a>`}
    <a href="#/cards/l/${n}">本课闪卡 ▤</a>
    ${n < 50 ? `<a href="#/l/${n + 1}">Lesson ${n + 1} · ${esc(byLesson[n + 1].t)} →</a>` : `<a href="#/plan">全部学完 · 回到计划 →</a>`}
  </div>`;
}

/* Flashcards --------------------------------------------------- */
function viewCards(param) {
  const due = dueReviews();
  const unknown = ALL_WORDS.filter((w) => !isKnown(w.r)).length;
  return `
  <div class="topbar"><span class="crumb">闪卡冲刺</span></div>
  <h1>闪卡冲刺</h1>
  <p class="lede">看英文，先在脑子里说中文，再翻面核对。标记“记住了”会同时把该词记入学习进度。键盘：空格翻转，1 记住了，2 再练，← → 切换。</p>
  <div class="grid cols-3" style="margin-top:20px">
    <div class="card"><h3>整本 1000 词</h3><p>按词频顺序过一遍，适合碎片时间集中刷。</p>
      <div class="toolbar"><button class="btn" data-act="flash" data-scope="all" data-n="1000">开始</button></div></div>
    <div class="card"><h3>只练没记住的词</h3><p>当前还有 <b>${unknown}</b> 个词没有标记“已掌握”，这一组最适合冲刺。</p>
      <div class="toolbar"><button class="btn" data-act="flash" data-scope="unknown" data-n="0">开始</button></div></div>
    <div class="card"><h3>到期复习</h3><p>${due.length ? `有 <b>${due.length}</b> 课到了第 2/4/7/15/30 天的复习节点。` : "还没有到期的复习，先把不熟的词刷掉。"}</p>
      <div class="toolbar"><button class="btn ghost" data-act="flash" data-scope="due" data-n="0"${due.length ? "" : " disabled"}>开始</button></div></div>
  </div>
  <h2>按天练习</h2>
  <div class="grid cols-3">${BOOK.days.map((d) => {
    const p = dayProgress(d.n);
    const [a, b] = lessonRange(d.n);
    return `<div class="card"><span class="num">${esc(d.label)} · L${a}–L${b} · ${d.words} 词</span>
      <h3>${esc(d.theme)}</h3>
      <div class="bar"><i style="width:${(p.done / p.total) * 100}%"></i></div>
      <span class="meta">${p.done} / ${p.total} 词已掌握</span>
      <div class="toolbar"><button class="btn ghost" data-act="flash" data-scope="c" data-n="${d.n}">本日闪卡</button>
      <a class="chip-btn" href="#/d/${d.n}">看当日安排</a></div></div>`;
  }).join("")}</div>`;
}

function viewIndex() {
  const letters = "abcdefghijklmnopqrstuvwxyz".split("");
  const groups = {};
  ALPHA.forEach((w) => {
    const ch = w.b[0];
    (groups[ch] = groups[ch] || []).push(w);
  });
  const nav = letters.map((ch) => groups[ch]
    ? `<a href="#/index/${ch}" data-act="letter" data-letter="${ch}">${ch.toUpperCase()}</a>`
    : `<span>${ch.toUpperCase()}</span>`).join("");
  const body = letters.filter((ch) => groups[ch]).map((ch) => `
    <div data-group="${ch}">
      <div class="letter-head">${ch.toUpperCase()}</div>
      ${groups[ch].map((w) => `<div class="ix-row">
        <span class="dot ${isKnown(w.r) ? "on" : ""}" data-dot="${w.r}"></span>
        <a href="#/l/${w.lesson}/w${w.r}">${esc(w.w)}</a>
        <span class="zh">${esc(w.zh)}</span>
        <span class="r">#${w.r} · L${w.lesson}</span>
      </div>`).join("")}
    </div>`).join("");
  return `
  <div class="topbar"><span class="crumb">A–Z 索引</span></div>
  <h1>1000 词字母索引</h1>
  <p class="lede">按字母顺序排列，点单词跳到它的卡片。左边的绿点表示这个词已经标记为掌握。</p>
  <div class="letters">${nav}</div>
  <div class="nav-search" style="max-width:420px">
    <input type="search" id="indexFilter" placeholder="过滤：输入单词或中文" aria-label="过滤索引">
  </div>
  <div id="indexBody">${body}</div>`;
}

/* Navigation tree ---------------------------------------------- */
function renderNav() {
  const current = currentContext();
  const html = BOOK.days.map((d) => {
    const [a, b] = lessonRange(d.n);
    const p = dayProgress(d.n);
    const open = current.day === d.n;
    let items = "";
    for (let n = a; n <= b; n++) {
      const lesson = byLesson[n];
      const active = current.lesson === n;
      items += `<a class="nav-lesson ${active ? "active" : ""} ${lessonDone(n) ? "done" : ""}" href="#/l/${n}">
        <span class="no">${n}</span>
        <span class="t">${esc(lesson.t)}<i>${lessonProgress(n)}/20 已掌握</i></span>
      </a>`;
    }
    return `<details class="ch-group" ${open ? "open" : ""}>
      <summary><span class="ch-badge">${d.n}</span> ${esc(d.theme)}
        <span class="ch-prog">${p.done}/${p.total}</span></summary>
      <a class="nav-lesson" href="#/d/${d.n}"><span class="no">▤</span><span class="t">当日安排与复盘<i>${esc(d.label)} · ${d.words} 词</i></span></a>
      ${items}
    </details>`;
  }).join("");
  $("#navDays").innerHTML = html;
}
function currentContext() {
  const p = parseHash();
  if (p[0] === "l") return { day: Math.ceil(Number(p[1]) / 10), lesson: Number(p[1]) };
  if (p[0] === "d" || p[0] === "ch") return { day: Number(p[1]), lesson: 0 };
  return { day: 0, lesson: 0 };
}
/* Router ------------------------------------------------------- */
function parseHash() {
  return location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
}
function render() {
  const p = parseHash();
  const view = $("#view");
  const crumb = $("#crumb");
  let heading = "1000 个最常用英语单词 · 学习手册";
  let html = "";
  let afterRender = null;
  if (p[0] === "l") {
    const n = Math.min(50, Math.max(1, parseInt(p[1], 10) || 1));
    html = viewLesson(n);
    crumb.textContent = `Lesson ${n} · ${dayOf(n).label}`;
    heading = `Lesson ${n} · ${byLesson[n].t}`;
    if (p[2] && /^w\d+$/.test(p[2])) {
      const rank = Number(p[2].slice(1));
      afterRender = () => jumpToCard(rank, true);
    }
  } else if (p[0] === "d" || p[0] === "ch") {
    const d = Math.min(BOOK.days.length, Math.max(1, parseInt(p[1], 10) || 1));
    html = viewDay(d);
    crumb.textContent = `${BOOK.days[d - 1].label} · ${BOOK.days[d - 1].theme}`;
    heading = `${BOOK.days[d - 1].label} · ${BOOK.days[d - 1].theme}`;
  } else if (p[0] === "index") {
    html = viewIndex();
    crumb.textContent = "A–Z 索引";
    heading = "1000 词字母索引";
    const letter = (p[1] || "").toLowerCase();
    if (letter) afterRender = () => scrollToLetter(letter);
  } else if (p[0] === "cards") {
    html = viewCards(p[1]);
    crumb.textContent = "闪卡复习";
    heading = "闪卡复习";
  } else if (p[0] === "plan") {
    html = viewPlan(true);
    crumb.textContent = "速通计划";
    heading = "5 天速通计划";
  } else {
    html = viewPlan(false);
    crumb.textContent = "总目录";
    heading = "1000 个最常用英语单词 · 学习手册";
  }
  view.innerHTML = html;
  const sr = $("#searchResults");
  if (sr) { sr.hidden = true; sr.innerHTML = ""; }
  const ns = $("#navSearch");
  if (ns) ns.value = "";
  document.title = heading;
  renderNav();
  refreshCounters();
  if (afterRender) afterRender();
  else window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  document.body.classList.remove("nav-open");
}
function scrollToLetter(letter) {
  const el = document.querySelector(`[data-group="${letter}"]`);
  if (el) el.scrollIntoView({ block: "start" });
}
function jumpToCard(rank, scroll) {
  const el = $(`#w${rank}`);
  if (!el) return;
  if (scroll) el.scrollIntoView({ block: "center" });
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}
window.addEventListener("hashchange", render);

/* Global search ------------------------------------------------ */
function runSearch(q) {
  const box = $("#searchResults");
  const term = q.trim().toLowerCase();
  if (term.length < 1) { box.hidden = true; box.innerHTML = ""; return; }
  const starts = [], contains = [], zhHit = [];
  for (const w of ALL_WORDS) {
    if (w.b.startsWith(term)) starts.push(w);
    else if (w.b.includes(term)) contains.push(w);
    else if (w.zh.includes(q.trim())) zhHit.push(w);
    if (starts.length > 12) break;
  }
  const out = starts.concat(contains, zhHit).slice(0, 12);
  if (!out.length) {
    box.innerHTML = `<div style="padding:10px 12px" class="meta">没有找到“${esc(q)}”</div>`;
    box.hidden = false;
    return;
  }
  box.innerHTML = out.map((w) => `<a href="#/l/${w.lesson}/w${w.r}">
    <span class="en">${esc(w.w)}</span>
    <span class="meta">${esc(w.ipa)}</span>
    <span class="zh">${esc(w.zh)}<br>#${w.r} · L${w.lesson}</span>
  </a>`).join("");
  box.hidden = false;
}

/* Flashcards --------------------------------------------------- */
const FC = { scope: null, n: null, list: [], i: 0, flipped: false, know: 0, miss: 0 };
function openFlash(scope, n) {
  let list = [];
  let title = "";
  if (scope === "l") { list = byLesson[n].words.slice(); title = `Lesson ${n} · ${byLesson[n].t}`; }
  else if (scope === "c") {
    const [a, b] = lessonRange(n);
    for (let i = a; i <= b; i++) list = list.concat(byLesson[i].words);
    title = `${BOOK.days[n - 1].label} · ${BOOK.days[n - 1].theme}`;
  } else if (scope === "unknown") {
    list = ALL_WORDS.filter((w) => !isKnown(w.r));
    title = "还没记住的词";
  } else if (scope === "due") {
    dueReviews().forEach((n2) => list = list.concat(byLesson[n2].words));
    title = "今天要复习的课";
  } else { list = ALL_WORDS.slice(); title = "整本 1000 词"; }
  if (!list.length) { toast("这组里没有单词"); return; }
  FC.scope = scope; FC.n = n; FC.list = list; FC.i = 0; FC.flipped = false; FC.know = 0; FC.miss = 0;
  $("#fcTitle").textContent = title;
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";
  paintFlash();
}
function closeFlash() {
  $("#overlay").hidden = true;
  document.body.style.overflow = "";
  if (window.speechSynthesis) speechSynthesis.cancel();
  render();
}
function paintFlash() {
  const card = $("#flashcard");
  const w = FC.list[FC.i];
  card.classList.toggle("flipped", FC.flipped);
  $("#fcFront").innerHTML = `<div class="fword">${esc(w.w)}</div>
    <div class="fipa">${esc(w.ipa)}</div>
    <div class="meta">${esc(w.pos)} · #${w.r} · L${w.lesson}</div>
    <div class="meta">点卡片或按空格翻面</div>`;
  $("#fcBack").innerHTML = `<div class="fzh">${esc(w.zh)}</div>
    <div class="fdef">${esc(w.def)}</div>
    <div class="fex">${esc(w.ee)}<em>${esc(w.ez)}</em></div>
    <div class="ph">${w.ph.map(([k, v]) => `<span><b>${esc(k)}</b>${esc(v)}</span>`).join("")}</div>`;
  $("#fcCount").textContent = `${FC.i + 1} / ${FC.list.length}`;
  $("#fcProgress").textContent = `记住 ${FC.know} · 再练 ${FC.miss}`;
}
function fcNext(step) {
  FC.i = (FC.i + step + FC.list.length) % FC.list.length;
  FC.flipped = false;
  paintFlash();
}
function fcSet(known) {
  const w = FC.list[FC.i];
  if (known) {
    if (!isKnown(w.r)) toggleKnown(w.r);
    FC.know++;
    const el = $(`.known-btn[data-rank="${w.r}"]`);
    if (el) { el.dataset.known = "1"; el.textContent = el.classList.contains("speak") ? "✓" : "已掌握 ✓"; }
    FC.list.splice(FC.i, 1);
    if (!FC.list.length) { toast("这一组都过完啦 🎉"); closeFlash(); return; }
    if (FC.i >= FC.list.length) FC.i = FC.list.length - 1;
  } else {
    FC.miss++;
    FC.i = (FC.i + 1) % FC.list.length;
  }
  FC.flipped = false;
  paintFlash();
}

/* Quiz --------------------------------------------------------- */
function normAns(s) {
  return String(s).toLowerCase().trim().replace(/[.,!?;:"'’]/g, "").replace(/\s+/g, " ");
}
function checkQuiz() {
  const qs = $$(".q", $("#view"));
  let ok = 0;
  qs.forEach((q) => {
    const input = $("input", q);
    const ans = q.dataset.ans;
    const good = normAns(input.value) === normAns(ans);
    q.classList.toggle("ok", good);
    q.classList.toggle("no", !good && input.value.trim() !== "");
    $(".verdict", q).textContent = input.value.trim() === "" ? "未作答" : good ? "✓ 正确" : "✗ 再想想";
    if (good) ok++;
  });
  const score = $("#quizScore");
  if (score) score.textContent = `答对 ${ok} / ${qs.length}`;
}
function showAnswers() {
  $$(".q", $("#view")).forEach((q) => {
    const input = $("input", q);
    if (!input.value.trim()) input.value = q.dataset.ans;
    checkQuiz();
  });
}

/* Event wiring ------------------------------------------------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (!e.target.closest(".nav-search")) { const r = $("#searchResults"); if (r) r.hidden = true; }
    return;
  }
  const act = el.dataset.act;
  if (act === "speak") {
    speak(el.dataset.text, Number(el.dataset.rate || 0.92));
  } else if (act === "known") {
    toggleKnown(Number(el.dataset.rank));
    const on = isKnown(Number(el.dataset.rank));
    el.dataset.known = on ? 1 : 0;
    el.textContent = el.closest("table") ? (on ? "✓" : "○") : (on ? "已掌握 ✓" : "标记掌握");
    const dot = $(`[data-dot="${el.dataset.rank}"]`);
    if (dot) dot.classList.toggle("on", on);
  } else if (act === "jump") {
    e.preventDefault();
    jumpToCard(Number(el.dataset.rank), true);
  } else if (act === "flash") {
    openFlash(el.dataset.scope, Number(el.dataset.n));
  } else if (act === "toggle-zh") {
    const t = document.getElementById(el.dataset.target);
    if (t) t.hidden = !t.hidden;
  } else if (act === "done") {
    toggleDone(Number(el.dataset.n));
  } else if (act === "check") {
    checkQuiz();
  } else if (act === "answers") {
    showAnswers();
  } else if (act === "study") {
    const rank = Number(el.dataset.rank);
    if (!isKnown(rank)) toggleKnown(rank);
    toast("已加入复习并标记为掌握");
    el.textContent = "已加入复习 ✓";
  } else if (act === "letter") {
    e.preventDefault();
    scrollToLetter(el.dataset.letter);
    history.replaceState(null, "", `#/index/${el.dataset.letter}`);
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "navSearch") runSearch(t.value);
  else if (t.id === "indexFilter") {
    const q = t.value.trim().toLowerCase();
    $$("[data-group]").forEach((g) => {
      let visible = 0;
      $$(".ix-row", g).forEach((row) => {
        const show = !q || row.textContent.toLowerCase().includes(q);
        row.hidden = !show;
        if (show) visible++;
      });
      g.hidden = visible === 0;
    });
  } else if (t.dataset && t.dataset.act === "note") {
    state.notes["L" + t.dataset.n] = t.value;
    save();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/input|textarea/i.test(e.target.tagName)) {
    e.preventDefault();
    $("#navSearch").focus();
  }
  if ($("#overlay").hidden) return;
  if (e.key === "Escape") closeFlash();
  else if (e.key === " ") { e.preventDefault(); FC.flipped = !FC.flipped; paintFlash(); }
  else if (e.key === "ArrowRight") fcNext(1);
  else if (e.key === "ArrowLeft") fcNext(-1);
  else if (e.key === "1") fcSet(true);
  else if (e.key === "2") fcSet(false);
});
$("#fcFlip").onclick = () => { FC.flipped = !FC.flipped; paintFlash(); };
$("#fcNext").onclick = () => fcNext(1);
$("#fcPrev").onclick = () => fcNext(-1);
$("#fcKnow").onclick = () => fcSet(true);
$("#fcSkip").onclick = () => fcSet(false);
$("#fcExit").onclick = closeFlash;
$("#fcSpeak").onclick = () => speak(FC.list[FC.i].w);
$("#fcShuffle").onclick = () => {
  for (let i = FC.list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [FC.list[i], FC.list[j]] = [FC.list[j], FC.list[i]];
  }
  FC.i = 0; FC.flipped = false; paintFlash(); toast("已打乱顺序");
};
$("#flashcard").onclick = () => { FC.flipped = !FC.flipped; paintFlash(); };
$("#menuBtn").onclick = () => document.body.classList.toggle("nav-open");
$("#hideBtn").onclick = cycleMode;
$("#resetBtn").onclick = () => {
  if (!confirm("确定要清除本机保存的学习进度和笔记吗？")) return;
  state = { known: [], done: {}, mode: "all", notes: {} };
  save();
  render();
  toast("进度已重置");
};

/* Boot --------------------------------------------------------- */
$("#hideBtn").textContent = modeLabel();
$("#hideBtn").setAttribute("aria-pressed", state.mode === "all" ? "false" : "true");
render();
</script>

     Every family below is already installed on the reader's machine, so nothing
     is downloaded and no font file is redistributed with this site:
       Latin display   Cambria / Georgia (Windows + macOS) and Segoe UI
       Chinese         Noto Serif SC 思源宋体, Noto Sans SC, 思源黑体,
                       Microsoft YaHei 微软雅黑, Songti SC, PingFang SC, DengXian 等线
       Mono            JetBrains Mono (SIL OFL) for IPA, counts and labels
     Missing families are simply skipped by the browser, so a stack always ends
     in a safe system fallback. The choice is shared by all pages on this origin
     through localStorage["en.font"].
------------------------------------------------------------------------------ -->
<style>
.font-pick{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:26px;
background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
background-position:right 12px center,right 7px center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
</style>
<script>
(function () {
  var SANS_CJK = '"Noto Sans SC","Source Han Sans SC","思源黑体","Microsoft YaHei","PingFang SC"';
  var SONG_CJK = '"Noto Serif SC","Source Han Serif SC","Songti SC"';
  var SERIF_LATIN = "Cambria,Georgia,";
  var PRESETS = [
    {id: "song-hei", name: "字体 · 思源宋体标题 + 黑体正文（推荐）",
     serif: SERIF_LATIN + SONG_CJK + ",serif", body: SANS_CJK + ",sans-serif", cjk: SANS_CJK},
    {id: "song", name: "字体 · 全宋体（书卷气）",
     serif: SERIF_LATIN + SONG_CJK + ",serif", body: SERIF_LATIN + SONG_CJK + ",serif", cjk: SONG_CJK},
    {id: "hei", name: "字体 · 全黑体（现代）",
     serif: SANS_CJK + ",sans-serif", body: SANS_CJK + ",sans-serif", cjk: SANS_CJK},
    {id: "yahei", name: "字体 · 微软雅黑",
     serif: '"Segoe UI","微软雅黑","Microsoft YaHei","PingFang SC",sans-serif',
     body: '"Segoe UI","微软雅黑","Microsoft YaHei","PingFang SC",sans-serif',
     cjk: '"微软雅黑","Microsoft YaHei","PingFang SC"'},
    {id: "deng", name: "字体 · 等线（原版）",
     serif: '"DengXian","等线","PingFang SC","SF Pro Display",-apple-system,"Microsoft YaHei",sans-serif',
     body: '"DengXian","等线","PingFang SC","SF Pro Text",-apple-system,"Microsoft YaHei",sans-serif',
     cjk: '"DengXian","PingFang SC"'}
  ];
  var KEY = "en.font";

  function apply(id) {
    var pick = PRESETS[0];
    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) pick = PRESETS[i];
    var root = document.documentElement.style;
    root.setProperty("--serif", pick.serif);
    root.setProperty("--body", pick.body);
    root.setProperty("--mono", '"JetBrains Mono","SF Mono",ui-monospace,' + pick.cjk + ",monospace");
    return pick.id;
  }

  // ?font=<id> wins over the stored choice, so a preset can be linked or previewed.
  var asked = null;
  try { asked = new URLSearchParams(location.search).get("font"); } catch (e) {}
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var current = apply(asked || saved);
  if (asked) { try { localStorage.setItem(KEY, current); } catch (e) {} }

  function mount() {
    var bar = document.querySelector(".topbar");
    if (!bar || document.getElementById("fontPick")) return;
    var sel = document.createElement("select");
    sel.id = "fontPick";
    sel.className = "chip-btn font-pick";
    sel.title = "切换界面字体（只使用本机已安装的字体）";
    sel.setAttribute("aria-label", "界面字体");
    PRESETS.forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    sel.value = current;
    sel.onchange = function () {
      current = apply(sel.value);
      try { localStorage.setItem(KEY, current); } catch (e) {}
    };
    bar.appendChild(sel);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
  // Views are swapped on hashchange in some pages; re-mount if the picker is gone.
  window.addEventListener("hashchange", function () { setTimeout(mount, 0); });
})();
</script>

</body>
</html>
